<style>
:root{
  --bg-deep:#0F1428;
  --bg-surface:#171D3A;
  --bg-surface-2:#202849;
  --bg-surface-3:#28316099;
  --mint:#37E2A0;
  --mint-dim:#37E2A02e;
  --amber:#FFB648;
  --amber-dim:#FFB6482e;
  --peri:#8C93FF;
  --peri-dim:#8C93FF2e;
  --sky:#5AC8FF;
  --sky-dim:#5AC8FF2e;
  --forgot:#FF8A4C;
  --forgot-dim:#FF8A4C2e;
  --gray-node:#3A4270;
  --text:#F4F6FF;
  --text-muted:#9AA3C9;
  --text-faint:#6B739C;
  --border:rgba(255,255,255,0.08);
  --danger:#FF6B6B;
  --radius:16px;
  --radius-sm:10px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
*,*::before,*::after{font-family:'Lexend',sans-serif!important;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, #1c2452 0%, transparent 45%),
    radial-gradient(circle at 90% 8%, #17204a 0%, transparent 40%),
    var(--bg-deep);
  color:var(--text);
  font-family:'Source Sans 3',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-bottom:calc(84px + var(--safe-bottom));
}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--bg-surface-2);border-radius:10px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ---------- Generic layout bits ---------- */
.screen{padding:20px 18px 8px;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{
  background:linear-gradient(160deg, var(--bg-surface) 0%, var(--bg-surface-2) 100%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--text-faint);
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg-surface-3);
  border:1px solid var(--border);
  padding:5px 11px;border-radius:999px;
  font-size:12.5px;color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
}
.btn{
  border:none;border-radius:12px;padding:13px 18px;
  font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--mint),#20C488);color:#06301F;box-shadow:0 6px 18px -6px #37E2A066;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:var(--bg-surface-2);color:var(--text);border:1px solid var(--border);}
.btn-outline{background:transparent;color:var(--mint);border:1px solid #37E2A055;}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #FF6B6B44;}
.btn-block{width:100%;}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:9px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
.field input, .field select{
  width:100%;background:var(--bg-surface-2);border:1px solid var(--border);
  color:var(--text);padding:12px 13px;border-radius:10px;font-size:14.5px;outline:none;
}
.field input:focus, .field select:focus{border-color:#37E2A088;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);}
.center{text-align:center;}
.quick-nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:6;background:var(--bg-deep);padding:8px 0 10px;margin:0 0 4px;scrollbar-width:none;}
.quick-nav::-webkit-scrollbar{display:none;}
[id^="sec-"]{scroll-margin-top:56px;}
.evo-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:128px;overflow-y:auto;margin:10px 0 4px;}
.evo-chip{border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-muted);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
.evo-chip.active{background:var(--peri-dim);border-color:#8C93FF88;color:var(--text);}
.bars-scroll{overflow-x:auto;padding-bottom:4px;}
.evo-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--text-muted);}
.evo-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.hist-group{border-bottom:1px solid var(--border);}
.hist-group:last-child{border-bottom:none;}
.hist-group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;}
.hist-group>summary::-webkit-details-marker{display:none;}
.hist-group>summary::after{content:'▾';color:var(--text-faint);transition:transform .15s;flex-shrink:0;}
.hist-group:not([open])>summary::after{transform:rotate(-90deg);}
.quick-nav .qn-chip{flex-shrink:0;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-muted);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin:22px 0 10px;font-weight:600;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.badge-green{color:var(--mint);background:var(--mint-dim);border:1px solid #37E2A044;}
.badge-amber{color:var(--amber);background:var(--amber-dim);border:1px solid #FFB64844;}
.badge-peri{color:var(--peri);background:var(--peri-dim);border:1px solid #8C93FF44;}
.badge{padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;font-family:'JetBrains Mono',monospace;}


/* ---------- Comparativo e leitura de tendência da evolução ---------- */
.evo-compare-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
.evo-compare-heading small{display:block;color:var(--text-muted);font-size:10.5px;margin-bottom:4px;}
.evo-compare-heading strong{display:block;font-size:13px;text-transform:capitalize;}
.evo-compare-previous{text-align:right;}
.evo-compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.evo-compare-metric{min-width:0;border:1px solid var(--border);border-radius:12px;background:var(--bg-surface-2);padding:10px 9px;}
.evo-compare-metric span{display:block;font-size:11px;color:var(--text-muted);line-height:1.35;}
.evo-compare-metric strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;margin:5px 0;}
.evo-compare-metric small{display:block;font-size:10px;line-height:1.4;color:var(--text-muted);overflow-wrap:anywhere;}
.evo-trend-box{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:var(--bg-surface-2);border:1px solid var(--border);}
.evo-trend-icon{font-size:22px;flex-shrink:0;}
.evo-trend-box strong{font-size:12.5px;}
.evo-trend-box p{font-size:11.5px;line-height:1.5;color:var(--text-muted);margin:4px 0 0;}
@media(max-width:380px){.evo-compare-grid{grid-template-columns:1fr;}.evo-compare-metric{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 8px;}.evo-compare-metric strong{grid-column:2;grid-row:1/3;margin:0;}.evo-compare-metric small{grid-column:1;}}

/* ---------- Perfil do aluno: pesquisa e histórico mais intuitivos ---------- */
.profile-edit-intro{padding:13px 14px;border-radius:12px;background:var(--mint-dim);border:1px solid #37E2A044;}
.profile-edit-intro strong{display:block;font-size:14px;color:var(--text);}
.profile-edit-intro span{display:block;margin-top:4px;font-size:12px;line-height:1.45;color:var(--text-muted);}
.admin-profile-hero{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(145deg,#202849 0%,#171D3A 72%);border:1px solid rgba(55,226,160,.22);border-radius:18px;margin-bottom:20px;box-shadow:0 12px 28px #00000018;}
.admin-profile-mark{width:58px;height:58px;display:grid;place-items:center;flex-shrink:0;border-radius:17px;background:linear-gradient(135deg,var(--mint-dim),var(--sky-dim));border:1px solid #37E2A044;font-size:29px;}
.admin-profile-heading{min-width:0;}
.admin-profile-heading h2{font-size:19px;line-height:1.2;margin:0 0 4px;}
.admin-profile-heading p{font-size:12px;line-height:1.4;color:var(--text-muted);margin:0;overflow-wrap:anywhere;}
.admin-profile-section{margin:0 0 18px;}
.admin-profile-section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.02em;margin:0 0 9px;color:var(--text);}
.admin-profile-card{padding:16px;background:linear-gradient(160deg,var(--bg-surface) 0%,var(--bg-surface-2) 100%);border:1px solid var(--border);border-radius:16px;box-shadow:0 6px 18px #00000012;}
.admin-profile-help{font-size:12px;line-height:1.55;color:var(--text-muted);margin:0 0 14px;}
.admin-profile-card .field-row{gap:10px;}
.admin-profile-card .field{min-width:0;}
.admin-profile-card .field input{min-height:46px;}
.admin-profile-card .btn{min-height:42px;}
.admin-profile-back{margin-top:4px;}
@media(max-width:380px){.admin-profile-hero{padding:14px;gap:11px;}.admin-profile-mark{width:50px;height:50px;font-size:25px;border-radius:14px;}.admin-profile-card{padding:13px;}.admin-profile-card .field-row{gap:7px;}}

.evo-student-results{display:flex;flex-direction:column;gap:7px;margin-top:8px;max-height:260px;overflow:auto;padding:1px 2px 4px;}
.evo-student-result{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:13px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text);cursor:pointer;min-width:0;}
.evo-student-result.active{border-color:var(--peri);background:var(--peri-dim);box-shadow:0 0 0 1px #8C93FF22;}
.evo-result-avatar{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:11px;background:var(--bg-surface-2);font-size:21px;}
.evo-result-info{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.evo-result-info strong{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.evo-result-info small{font-size:10.5px;color:var(--text-muted);}
.evo-result-action{font-size:10.5px;color:var(--peri);font-weight:700;white-space:nowrap;}
.monthly-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.monthly-overview>div{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 8px;min-width:0;}
.monthly-overview small{display:block;font-size:10px;line-height:1.3;color:var(--text-muted);}
.monthly-overview strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:21px;margin-top:5px;}
.monthly-record{padding:2px 0;}
.monthly-record>summary{padding:13px 0;}
.monthly-record-main{width:100%;min-width:0;}
.monthly-record-title{font-size:13.5px;font-weight:700;text-transform:capitalize;}
.monthly-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.monthly-metrics span{display:flex;align-items:baseline;gap:4px;background:var(--bg-surface-2);border-radius:8px;padding:7px 8px;min-width:0;}
.monthly-metrics b{font-family:'JetBrains Mono',monospace;font-size:13px;}
.monthly-metrics small{font-size:10px;color:var(--text-muted);}
.monthly-record-detail{padding:0 0 14px;}
.empty-history{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:22px 8px;}
.empty-history>span{font-size:30px;}
.empty-history b{font-size:14px;}
.empty-history small{font-size:12px;color:var(--text-muted);line-height:1.45;max-width:250px;}
@media(max-width:360px){.evo-result-action{font-size:0}.evo-result-action span{font-size:18px}.monthly-overview strong{font-size:18px}.monthly-metrics span{gap:2px;padding:7px 5px}}

/* ---------- Perfil do aluno: calendário mensal responsivo ---------- */
.student-calendar-compact{width:100%;max-width:440px;margin:0 auto;padding:0;}
.student-calendar-card{padding:16px 14px;background:linear-gradient(160deg,var(--bg-surface) 0%,#1b2344 100%);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 30px #00000018;}
.student-calendar-compact .cal-header{margin-bottom:16px;}
.student-calendar-compact .cal-month-label{font-size:15px;letter-spacing:.01em;}
.student-calendar-compact .cal-summary{padding:12px;border:1px solid var(--border);border-radius:13px;background:#0f142844;margin-bottom:15px;}
.student-calendar-compact .cal-summary-pct{font-size:25px;}
.student-calendar-compact .cal-summary-breakdown{gap:7px 12px;}
.student-calendar-compact .cal-summary-breakdown span{font-size:10.5px;}
.student-calendar-compact .cal-weekdays,.student-calendar-compact .cal-grid{gap:6px;}
.student-calendar-compact .cal-weekdays{margin-bottom:8px;}
.student-calendar-compact .cal-weekdays span{font-size:10px;letter-spacing:.04em;}
.student-calendar-compact .cal-cell{font-size:11px;max-width:none;width:100%;border-radius:10px;}
.student-calendar-compact .cal-legend{gap:9px 14px;padding-top:12px;border-top:1px solid var(--border);}
.student-calendar-compact .cal-legend span{font-size:10.5px;}
@media(max-width:380px){.student-calendar-card{padding:13px 10px;}.student-calendar-compact .cal-weekdays,.student-calendar-compact .cal-grid{gap:4px;}.student-calendar-compact .cal-cell{border-radius:8px;font-size:10px;}.student-calendar-compact .cal-summary{padding:10px;}}
.student-study-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch;}
.student-study-entry{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;gap:9px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:15px;background:linear-gradient(145deg,var(--bg-surface) 0%,var(--bg-surface-2) 100%);min-width:0;box-shadow:0 3px 10px #00000008;}
.student-study-entry-icon{width:30px;height:30px;border-radius:9px;background:var(--mint-dim);display:flex;align-items:center;justify-content:center;font-size:15px;}
.student-study-entry-content{min-width:0;align-self:center;}
.student-study-entry-date{font-size:12px;font-weight:750;line-height:1.4;overflow-wrap:anywhere;}
.student-study-entry-label{font-size:10px;color:var(--text-muted);margin-top:3px;}
.student-study-entry-note{grid-column:1 / -1;margin-top:0;padding:8px 9px;border-radius:9px;background:var(--bg-surface);border:1px solid var(--border);font-size:11.5px;line-height:1.45;color:var(--text-muted);overflow-wrap:anywhere;}
.student-study-sheets{text-align:center;white-space:nowrap;padding:6px 8px;border-radius:10px;background:var(--mint-dim);color:var(--text);grid-column:1 / -1;display:flex;align-items:baseline;justify-content:center;gap:5px;}
.student-study-sheets strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:17px;line-height:1.2;}
.student-study-sheets small{display:block;font-size:9px;color:var(--text-muted);margin-top:2px;}
@media(max-width:420px){.student-study-list{grid-template-columns:1fr;gap:8px;}.student-study-entry{padding:10px;}.student-study-entry-note{grid-column:1 / -1;}.student-study-sheets{justify-content:flex-start;padding:5px 8px;}.student-study-sheets strong{font-size:15px;}.student-study-sheets small{margin-top:0;}}

/* ---------- Landing ---------- */
.landing-wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;text-align:center;gap:6px;
}
.logo-mark{
  width:74px;height:74px;border-radius:22px;
  background:linear-gradient(135deg,var(--mint),#5AC8FF 60%, var(--peri));
  display:flex;align-items:center;justify-content:center;font-size:34px;
  margin-bottom:18px;box-shadow:0 12px 34px -10px #37E2A055;
}
.wordmark{font-size:26px;font-weight:700;letter-spacing:.01em;}
.wordmark span{color:var(--mint);}
.tagline{color:var(--text-muted);font-size:14px;margin:6px 0 30px;max-width:280px;line-height:1.5;}
.code-box{width:100%;max-width:300px;}
.code-input{
  width:100%;text-align:center;letter-spacing:.3em;font-family:'JetBrains Mono',monospace;
  font-size:22px;padding:16px;border-radius:14px;background:var(--bg-surface);
  border:1px solid var(--border);color:var(--text);outline:none;margin-bottom:12px;
}
.code-input:focus{border-color:#37E2A088;}
.maint-card{width:100%;max-width:340px;margin-top:6px;padding:26px 22px;text-align:center;border-radius:20px;background:linear-gradient(160deg,var(--bg-surface) 0%,var(--bg-surface-2) 100%);border:1px solid #FFB64855;}
.maint-ic{font-size:40px;line-height:1;display:inline-block;animation:maintwiggle 2.6s ease-in-out infinite;}
.maint-title{margin:12px 0 6px;font-size:20px;color:var(--amber);}
.maint-text{margin:0;font-size:13.5px;line-height:1.55;color:var(--text-muted);}
@keyframes maintwiggle{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
@media (prefers-reduced-motion:reduce){.maint-ic{animation:none;}}
.landing-link{margin-top:26px;font-size:13px;color:var(--text-faint);text-decoration:underline;background:none;border:none;}
.error-msg{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  max-width:520px;margin:0 auto;
  background:rgba(20,25,50,0.86);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;padding:8px 6px calc(8px + var(--safe-bottom));
  z-index:50;
}
.nav-btn{
  flex:1;background:none;border:none;color:var(--text-faint);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;
  font-size:10.5px;font-weight:600;
}
.nav-btn .ic{font-size:19px;}
.nav-btn.active{color:var(--mint);background:#37E2A014;}

/* ---------- Header ---------- */
.top-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 18px 4px;
}
.avatar-circle{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,var(--peri),#5AC8FF);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.greeting-name{font-size:19px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
.icon-btn{
  width:38px;height:38px;border-radius:10px;background:var(--bg-surface-2);
  border:1px solid var(--border);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:16px;
}

/* ---------- Progress bar ---------- */
.progress-track{
  width:100%;height:12px;border-radius:20px;background:var(--bg-surface-2);
  overflow:hidden;border:1px solid var(--border);
}
.progress-fill{
  height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--mint),#5AC8FF);
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}
.progress-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}

/* ---------- Trilha de evolução (signature element) ---------- */
.trail-wrap{
  position:relative;overflow-x:auto;overflow-y:hidden;
  padding:20px 6px 16px;margin:0 -4px;
  -webkit-overflow-scrolling:touch;
}
.trail-track{
  display:flex;align-items:center;position:relative;min-width:max-content;padding:0 13px;
}
.trail-marker{
  display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;position:relative;z-index:2;
}
.trail-marker .cap{
  width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--bg-surface-2);border:1px solid var(--border);
}
.trail-node{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;position:relative;z-index:2;
  margin:0 3px;border:2px solid var(--gray-node);background:var(--bg-surface);
}
.trail-node.done-corrected{background:var(--mint);border-color:var(--mint);}
.trail-node.done-pending{background:var(--amber);border-color:var(--amber);}
.trail-node.current{box-shadow:0 0 0 3px #8C93FF40;}
.trail-line{
  position:absolute;left:36px;right:36px;top:50%;height:2.5px;background:var(--gray-node);
  transform:translateY(-50%);border-radius:4px;z-index:1;
}
.trail-line-fill{
  position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--mint),var(--amber));
  border-radius:4px;transition:width .5s ease;
}

/* ---------- Meu ritmo ---------- */
.ritmo-cols{display:flex;gap:12px;}
.ritmo-col{flex:1;background:var(--bg-surface-2);border-radius:12px;padding:14px;text-align:center;border:1px solid var(--border);}
.ritmo-num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
.ritmo-label{font-size:11px;color:var(--text-faint);margin-top:2px;text-transform:uppercase;letter-spacing:.05em;}
.ritmo-delta{margin-top:10px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}

/* ---------- Goal banner ---------- */
.goal-banner{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#8C93FF22,#37E2A022);
  border:1px solid #8C93FF55;border-radius:var(--radius);
  padding:22px 16px;text-align:center;margin-bottom:14px;
  animation:pulseglow 2.4s ease-in-out infinite;
}
@keyframes pulseglow{0%,100%{box-shadow:0 0 0 0 #8C93FF22;}50%{box-shadow:0 0 26px 4px #8C93FF33;}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.confetti span{position:absolute;top:-24px;font-size:15px;animation:confetti-fall linear infinite;}
@keyframes confetti-fall{0%{transform:translateY(-24px) rotate(0deg);opacity:1;}90%{opacity:1;}100%{transform:translateY(180px) rotate(360deg);opacity:0;}}
.stars-row{font-size:30px;display:block;margin-bottom:6px;animation:starbounce 1s ease-in-out infinite;position:relative;}
@keyframes starbounce{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.1);}}

/* ---------- Balanço do trimestre (ao encerrar a meta do aluno) ---------- */
.tb-overlay{position:fixed;inset:0;background:#0A0E1AB0;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.tb-card{position:relative;overflow:hidden;width:100%;max-width:360px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px 20px;text-align:center;box-shadow:0 20px 50px #00000055;}
.tb-card.reached{border-color:#8C93FF66;background:linear-gradient(180deg,#8C93FF14,var(--bg-surface) 60%);}
.tb-card .tb-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 6px;}
.tb-card .tb-stat{background:var(--bg-surface-2);border-radius:12px;padding:10px 4px;}
.tb-card .tb-stat .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;}
.tb-card .tb-stat .l{font-size:10px;color:var(--text-muted);margin-top:2px;}

/* ---------- Relatório do mês ---------- */
.report-winner{text-align:center;padding:18px 10px;}
.report-winner .avatars{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0 6px;}
.report-winner .w{display:flex;flex-direction:column;align-items:center;gap:6px;}
.report-winner .w .av{width:84px;height:84px;border-radius:24px;background:var(--bg-surface-2);display:flex;align-items:center;justify-content:center;font-size:44px;}
.report-winner .w .nm{font-weight:700;font-size:16px;}
@media print{
  .bottom-nav,.top-header,.no-print,.theme-toggle{display:none !important;}
  html,body{background:#fff !important;color:#111 !important;}
  .card,.report-winner .w .av,.hall-avatar{background:#fff !important;border:1px solid #bbb !important;box-shadow:none !important;}
  .muted,.faint,.eyebrow,.section-title{color:#333 !important;}
  .screen{padding:0 !important;}
}

/* ---------- Hall ---------- */
.hall-row{
  display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);
}
.hall-row:last-child{border-bottom:none;}
.hall-row.me{background:#8C93FF14;border:1px solid #8C93FF33;border-radius:12px;margin-bottom:6px;}
.hall-row.top3{background:var(--bg-surface-2);border-radius:10px;}
.hall-rank{width:26px;text-align:center;font-family:'JetBrains Mono',monospace;color:var(--text-faint);font-size:13px;flex-shrink:0;}
.hall-rank.medal{font-size:17px;}
.hall-avatar{width:36px;height:36px;border-radius:10px;background:var(--bg-surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.hall-row.top3 .hall-avatar{background:var(--bg-surface);}
.hall-name{font-weight:600;font-size:14px;}
.hall-tie{font-size:10px;color:var(--text-faint);font-weight:500;margin-left:6px;}
.hall-metric{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;flex-shrink:0;}
.hall-tabs{display:flex;gap:6px;margin-bottom:12px;}
.hall-tab{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text-muted);font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;}
.hall-tab.active{background:var(--peri);color:#fff;border-color:var(--peri);}
.growth-msg{
  background:var(--bg-surface-2);border:1px dashed var(--border);border-radius:12px;padding:12px 14px;
  font-size:13px;color:var(--text-muted);margin-bottom:16px;
}

/* ---------- Profile badges ---------- */
.badges-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.badge-tile{
  background:var(--bg-surface-2);border:1px solid var(--border);border-radius:14px;
  padding:14px 6px;text-align:center;
}
.badge-tile.locked{opacity:.35;}
.badge-tile .bic{font-size:24px;display:block;margin-bottom:6px;}
.badge-tile .blabel{font-size:10.5px;color:var(--text-muted);font-weight:600;}

/* ---------- Admin blocks grid ---------- */
.blocks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.block-tile-wrap{position:relative;}
.block-btn{
  width:100%;
  border-radius:10px;border:1px solid var(--border);background:var(--bg-surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-faint);
  font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:700;gap:4px;padding:11px 4px;
}
.block-btn .status-ic{font-size:13px;}
.block-btn.pending{background:var(--amber-dim);border-color:#FFB64866;color:var(--amber);}
.block-btn.corrected{background:var(--mint-dim);border-color:#37E2A066;color:var(--mint);}
.block-label-input{
  width:100%;background:var(--bg-surface-2);border:1px solid var(--border);color:var(--text);
  padding:10px 4px;border-radius:9px;font-size:11.5px;text-align:center;font-family:'JetBrains Mono',monospace;
}
.forgot-flag{
  position:absolute;top:-7px;right:-7px;width:21px;height:21px;border-radius:50%;
  background:var(--bg-surface);border:1px solid var(--border);font-size:10px;
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);z-index:2;
}
.forgot-flag.active{background:var(--forgot);border-color:var(--forgot);color:#3A1400;box-shadow:0 0 0 3px #FF8A4C33;}
.remove-block-flag{
  position:absolute;top:-7px;left:-7px;width:21px;height:21px;border-radius:50%;
  background:var(--bg-surface);border:1px solid var(--border);font-size:10px;
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);z-index:2;
}
.remove-block-flag:active{background:var(--danger);border-color:var(--danger);color:#fff;}

/* ---------- Aviso de material esquecido (aluno) ---------- */
.forgot-banner{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--forgot-dim);border:1px solid #FF8A4C55;border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;
}
.forgot-banner .fic{font-size:20px;flex-shrink:0;}
.forgot-editor{
  margin-top:14px;padding:14px;border-radius:12px;
  background:var(--forgot-dim);border:1px solid #FF8A4C55;
}

/* ---------- Calendário de constância ---------- */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-month-label{font-weight:700;font-size:14px;text-transform:capitalize;font-family:'Space Grotesk',sans-serif;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;}
.cal-weekdays span{text-align:center;font-size:10px;color:var(--text-faint);font-weight:700;display:block;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{
  aspect-ratio:1;border-radius:9px;border:1px solid var(--border);background:var(--bg-surface-2);
  color:var(--text-muted);font-size:11.5px;font-family:'JetBrains Mono',monospace;font-weight:600;
  display:flex;align-items:center;justify-content:center;
}
.cal-cell.empty{background:transparent;border:none;}
.cal-cell.marked-kumon{background:var(--mint);border-color:var(--mint);color:#06301F;font-weight:700;}
.cal-cell.marked-presencial{background:var(--sky);border-color:var(--sky);color:#062A40;font-weight:700;}
.cal-cell.marked-teste{background:var(--peri);border-color:var(--peri);color:#1A1550;font-weight:700;}
.cal-cell.today{box-shadow:0 0 0 2px var(--peri) inset;}
.cal-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
.cal-legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);}
.cal-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.cal-summary{margin-bottom:14px;}
.cal-summary-main{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
.cal-summary-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:var(--mint);}
.cal-summary-label{font-size:12px;color:var(--text-muted);}
.cal-summary-track{width:100%;height:8px;border-radius:8px;background:var(--bg-surface-2);overflow:hidden;margin-bottom:8px;}
.cal-summary-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .4s ease;}
.cal-summary-breakdown{display:flex;gap:14px;flex-wrap:wrap;}
.cal-summary-breakdown span{font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

/* ---------- Admin list rows ---------- */
.student-row{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bg-surface);
  border:1px solid var(--border);margin-bottom:10px;
  color:var(--text);font:inherit;text-align:left;width:100%;cursor:pointer;
}
.student-row .info{flex:1;min-width:0;}
.student-row .prog-line{display:flex;align-items:center;gap:8px;margin-top:7px;}
.student-row .name-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.student-row .name-row .name{font-weight:700;font-size:14.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.student-row .meta-row{display:flex;align-items:center;gap:8px;margin-top:3px;}
.mini-track{flex:1;height:7px;border-radius:8px;background:var(--bg-surface-2);overflow:hidden;}
.mini-fill{height:100%;background:linear-gradient(90deg,var(--mint),#5AC8FF);}
.search-input{
  width:100%;background:var(--bg-surface);border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:12px;font-size:14px;outline:none;margin-bottom:14px;
}

/* ---------- Stat grid (admin overview) ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:14px;padding:15px;}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;}
.stat-label{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

/* ---------- Bar chart ---------- */
.bars-wrap{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-fill{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#5AC8FF,var(--mint));min-height:4px;}
.bar-label{font-size:9.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}

/* ---------- Prêmios: pontinhos de progresso + lista individual ---------- */
.reward-dots{display:flex;gap:7px;margin:2px 0 12px;}
.reward-dot{width:11px;height:11px;border-radius:50%;background:var(--bg-surface);border:1.5px solid var(--gray-node);flex-shrink:0;}
.reward-dot.filled{background:var(--mint);border-color:var(--mint);}
.reward-list{display:flex;flex-direction:column;gap:8px;}
.reward-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;border-radius:11px;background:var(--bg-surface-2);border:1px solid var(--border);
  font-size:13px;
}
.reward-choice{display:flex;gap:6px;}
.reward-chip{
  padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;
  background:var(--bg-surface);border:1px solid var(--border);color:var(--text-muted);
}
.reward-chip.active{background:var(--mint-dim);border-color:#37E2A066;color:var(--mint);}

/* ---------- Histórico de metas (trimestres) ---------- */
.meta-row{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;
  background:var(--bg-surface-2);border:1px solid var(--border);margin-bottom:8px;font-size:13px;
}
.meta-row .meta-range{flex:1;min-width:0;color:var(--text);}
.meta-row .meta-extra{font-size:11px;color:var(--text-faint);margin-top:2px;}
.meta-badge{padding:3px 9px;border-radius:8px;font-size:10.5px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.meta-badge.planned{color:var(--peri);background:var(--peri-dim);border:1px solid #8C93FF44;}
.meta-badge.active{color:var(--mint);background:var(--mint-dim);border:1px solid #37E2A044;}
.meta-badge.completed{color:var(--text-muted);background:var(--bg-surface-3);border:1px solid var(--border);}
.theme-picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.theme-chip{
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:8px 6px;border-radius:12px;
  background:var(--bg-surface-2);border:2px solid transparent;color:var(--text);font-size:10.5px;font-weight:600;
}
.theme-chip .te{font-size:24px;}
.theme-chip.sel{border-color:var(--peri);background:var(--peri-dim);}
.mission-card{
  position:relative;overflow:hidden;border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center;
  background:linear-gradient(135deg,var(--peri-dim),var(--mint-dim));border:1px solid #8C93FF55;
}
.mission-card.upcoming{text-align:left;padding:16px;background:linear-gradient(160deg,var(--bg-surface-2),var(--peri-dim));border:1px solid #8C93FF55;}
.mc-head{display:flex;align-items:center;gap:12px;}
.mc-emoji{width:52px;height:52px;border-radius:14px;background:var(--peri-dim);border:1px solid #8C93FF44;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.mc-head-text{flex:1;min-width:0;}
.mission-card.upcoming .m-tag, .mission-card.current .m-tag{margin-top:0;}
.mission-card.upcoming .m-name, .mission-card.current .m-name{font-size:18px;margin:2px 0 0;line-height:1.2;}
.mission-card.upcoming .m-msg, .mission-card.current .m-msg{margin-top:12px;}
.mission-card.current{text-align:left;padding:16px;background:linear-gradient(160deg,var(--bg-surface-2),var(--mint-dim));border:1px solid #37E2A055;}
.mission-card.current .mc-emoji{background:var(--mint-dim);border-color:#37E2A044;}
.mission-card.current .m-tag{color:var(--mint);}
.mode-switch{display:flex;gap:8px;margin-bottom:12px;}
.mode-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border-radius:12px;background:var(--bg-surface-2);border:2px solid transparent;color:var(--text);text-align:center;}
.mode-opt .mo-ic{font-size:22px;}
.mode-opt b{font-size:13px;}
.mode-opt small{font-size:10.5px;color:var(--text-muted);line-height:1.25;}
.mode-opt.sel{border-color:var(--peri);background:var(--peri-dim);}
.mc-chip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 9px;border-radius:999px;background:var(--amber-dim);color:var(--amber);border:1px solid #FFB64844;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.mc-route{display:flex;align-items:center;gap:10px;margin-top:14px;}
.mc-point{flex:1;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center;}
.mc-point.goal{background:var(--mint-dim);border-color:#37E2A055;}
.mc-lbl{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
.mc-val{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;margin-top:2px;color:var(--text);}
.mc-arrow{color:var(--peri);font-size:20px;flex-shrink:0;}
.mc-dates{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:13.5px;}
.mc-dates > div:not(.mc-line){text-align:center;}
.mc-line{flex:1;height:2px;background:repeating-linear-gradient(90deg,#8C93FF77 0 6px,transparent 6px 12px);}
.mc-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px;}
.mc-status{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px;border-radius:12px;font-size:13px;}
.mc-status.ok{background:var(--mint-dim);border:1px solid #37E2A044;}
.mc-status.warn{background:var(--amber-dim);border:1px solid #FFB64844;}
.mc-status .mc-sic{font-size:20px;line-height:1.2;}
.mc-status b{display:block;color:var(--text);}
.mc-status small{display:block;margin-top:3px;font-size:12px;color:var(--text-muted);}
.mc-status small.mc-quote{font-style:italic;margin-top:6px;}
.mc-editor{margin-top:16px;padding:14px;border-radius:12px;background:var(--bg-surface);border:1px solid var(--border);}
.mc-editor-title{font-weight:700;font-size:14px;}
.mc-hint{font-size:12px;color:var(--text-muted);margin:4px 0 12px;line-height:1.4;}
.mc-req{margin-left:6px;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700;background:var(--amber-dim);color:var(--amber);border:1px solid #FFB64844;}
.mc-count{text-align:right;font-size:11px;color:var(--text-faint);margin-top:4px;font-family:'JetBrains Mono',monospace;}

.mc-art{position:relative;margin:-16px -16px 14px;line-height:0;border-bottom:1px solid #37E2A033;}
.mc-art svg{display:block;width:100%;height:auto;}
.mc-art-cap{position:absolute;left:12px;bottom:10px;line-height:1.2;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.88);color:#0B5C7A;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.mc-art .sun-rays{transform-origin:330px 42px;animation:mcspin 28s linear infinite;}
.mc-art .wave1{animation:mcwave 7s linear infinite;}
.mc-art .wave2{animation:mcwave 11s linear infinite reverse;}
.mc-art .cloud{animation:mcdrift 18s ease-in-out infinite alternate;}
.mc-art .palm{transform-origin:70px 138px;animation:mcsway 4.5s ease-in-out infinite alternate;}

.jc{padding:16px;}
.jc-route{display:flex;align-items:stretch;gap:10px;}
.jc-point{flex:1;min-width:0;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.jc-point.goal{background:var(--mint-dim);border-color:#37E2A055;}
.jc-point.goal .jc-val{color:var(--mint);}
.jc-lbl{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
.jc-val{display:block;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:4px;color:var(--text);}
.jc-arrow{align-self:center;color:var(--peri);font-size:20px;flex-shrink:0;}
.jc-time{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.jc-dates{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;}
.jc-dates > div:first-child b, .jc-dates .jc-end b{display:block;font-size:14px;margin-top:2px;color:var(--text);}
.jc-end{text-align:right;}
.jc-count{text-align:center;padding:6px 14px;border-radius:14px;background:var(--amber-dim);border:1px solid #FFB64844;}
.jc-count b{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px;line-height:1.1;color:var(--amber);}

.jc-prog{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}

.tr-num{font-size:11px;font-weight:700;line-height:1.1;}

<body>
<div id="app"></div>

<noscript>
  <div style="background:#111827;color:#fff;padding:12px;text-align:center;">Este aplicativo requer JavaScript. Ative o JavaScript para usar MINHA META.</div>
</noscript>

<script>
/* =========================================================
   MINHA META — estado, dados e persistência (localStorage / Firestore)
   Compatível com GitHub Pages
   ========================================================= */

const STORAGE_KEY = 'kumon_level_up_v1';
const AVATARS = ['🚀','🦁','🐯','🦊','🐧','🦉','🐼','🦄','🐝','🦋','🐢','🐬'];

/* === Tema único fixo ===
   Emoji fixo: 🏖️
   Só o orientador (admin) pode alterar nome e mensagem.
*/
const MISSION_THEME_DEFAULT = { emoji:'🏖️', name:'Missão de Férias', msg:'Sol, mar e Kumon: um pouquinho por dia e você aproveita as férias com a meta no bolso!' };

let PLAN_THEME_DRAFT = null;   // rascunho do tema ao planejar a próxima meta (admin)
let EDIT_THEME_DRAFT = null;   // rascunho do tema ao editar o aluno (admin)
let PLAN_EDIT_ID = null;       // id da meta planejada que está sendo editada

// Draft helpers (emoji fixo)
const draftFromTheme = (t) => (t ? { emoji: t.emoji || MISSION_THEME_DEFAULT.emoji, name: t.name || '', message: t.message || '' } : { emoji: MISSION_THEME_DEFAULT.emoji, name: MISSION_THEME_DEFAULT.name, message: MISSION_THEME_DEFAULT.msg });

let BULK_END_CONFIRM = null;  // data aguardando confirmação (fim da meta de todos)
let PLAN_MODE_DRAFT = null;   // 'vacation' | 'normal' ao planejar a próxima meta
let EDIT_MODE_DRAFT = null;   // 'vacation' | 'normal' ao editar o aluno
const modeOfEntry = (e) => (e && e.mode) ? (e.mode==='normal' ? 'normal' : 'vacation') : (e && e.theme ? 'vacation' : 'normal');
function renderModeSwitch(key, mode){
  const opt = (m, ico, title, sub) => `<button type="button" class="mode-opt ${mode===m?'sel':''}" data-mode-switch="${key}:${m}" aria-pressed="${mode===m}"><span class="mo-ic">${ico}</span><b>${title}</b><small>${sub}</small></button>`;
  return `<div class="mode-switch" role="group" aria-label="Modo da meta">
    ${opt('vacation','🌴','Modo férias','Missão com tema para o aluno')}
    ${opt('normal','📘','Modo normal','Meta comum, sem tema')}
  </div>`;
}
function bindModeSwitch(key, setMode, boxId){
  const btns = document.querySelectorAll(`[data-mode-switch^="${key}:"]`);
  const box = document.getElementById(boxId);
  btns.forEach(b=> b.onclick = ()=>{
    const m = b.getAttribute('data-mode-switch').split(':')[1];
    setMode(m);
    btns.forEach(x=>{ const on = x===b; x.classList.toggle('sel', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    if(box) box.style.display = (m==='vacation') ? '' : 'none';
  });
}
function renderThemeEditor(key, d){
  // Editor simplificado: mostra emoji fixo e apenas campos de nome/mensagem para o orientador.
  return `
    <div class="field" style="text-align:center;">
      <label>Emoji da missão</label>
      <div style="font-size:42px; line-height:1; margin:8px 0 6px;">${esc(MISSION_THEME_DEFAULT.emoji)}</div>
    </div>
    <div class="field"><label>Nome da missão</label><input type="text" id="theme-${key}-name" maxlength="40" value="${esc(d.name||'')}"></div>
    <div class="field"><label>Mensagem para o aluno</label><input type="text" id="theme-${key}-msg" maxlength="140" value="${esc(d.message||'')}"></div>`;
}
function bindThemeEditor(key, getDraft){
  const d = getDraft();
  const nameI = document.getElementById(`theme-${key}-name`);
  if(!d || !nameI) return;
  const msgI = document.getElementById(`theme-${key}-msg`);
  nameI.oninput = ()=>{ d.name = nameI.value; };
  msgI.oninput = ()=>{ d.message = msgI.value; };
}

/* ---------- storage/state ---------- */
const STAGES = ['7A','6A','5A','4A','3A','2A','A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];

let DATA = null;                 // { students:[...] }
let SESSION = { role:null, studentId:null }; // role: 'student' | 'admin'
let HALL_TAB = 'sheets';         // aba ativa do Hall: sheets | streak | correction
let TB_MODAL = null;             // balanço do trimestre recém-encerrado, exibido para o orientador
let HALL_PERIOD_MODE = 'month';
let HALL_MONTH = '';
let HALL_TRIMESTER_INDEX = 0; // 0 = trimestre atual, 1+ = períodos anteriores
let UNDO_TRIMESTER_CONFIRM = null;
let ADMIN_VIEW = 'overview';
let STUDENT_VIEW = 'journey';
let SELECTED_STUDENT_ID = null;
let SEARCH_TERM = '';
let EVO_SEARCH = '';           // busca de aluno na aba Evolução
let LOGIN_ERROR = '';
/* ===== MODO MANUTENÇÃO =====
   true  = alunos veem o aviso de manutenção (o orientador continua entrando normalmente)
   false = site normal para todos */
const MAINTENANCE_MODE = true;
const MAINTENANCE_TEXT = 'Estamos atualizando o site e cadastrando novas informações dos alunos. Volte em breve!';
let ADMIN_LOGIN_STAGE = false;
let TOAST = null;
let CALENDAR_MONTH = null;
let EDIT_LABELS_MODE = false;
let EDIT_STUDENT_MODE = false;
let EDITING_FORGOT_INDEX = null;
let DELETE_CONFIRM_ID = null;
let PLAN_META_MODE = false;
let END_TRIMESTER_CONFIRM = null;
let AVAILABLE_BACKUPS = [];
let BACKUPS_LOADING = false;
let PENDING_RESTORE = null;
let DATA_SOURCE = null;
let FIREBASE_LAST_ERROR = null;
let SAVE_LAST_STATUS = null;
let SAVE_FAILURE_PENDING = false;
let THEME = 'dark';
const THEME_STORAGE_KEY = 'minha-meta-theme';
let ADMIN_LOGIN_ATTEMPTS = 0;
let ADMIN_LOGIN_LOCK_UNTIL = 0;
let ADMIN_LOGIN_LOCK_TIMER = null;
let EDITING_WEEK_HISTORY_ID = null;

/* ---------- Student proposal state (client-side UI) ---------- */
let STUDENT_PROPOSAL_MODE = null; // id da meta planejada que o aluno está propondo (apenas enquanto edita a proposta)

/* ---------- storage wrapper usando Firebase (com fallback para localStorage) ---------- */
const storage = {
  async get(key){
    if(window.firebase && typeof db !== 'undefined' && db){
      try{
        const doc = await db.collection('app_state').doc(key).get();
        FIREBASE_LAST_ERROR = null;
        if(doc.exists){
          return { value: doc.data().value, source:'firebase', exists:true, error:false };
        }
        return { value: null, source:'firebase', exists:false, error:false };
      }catch(e){
        FIREBASE_LAST_ERROR = e;
        console.warn('firebase.get error', e);
        try{
          const v = localStorage.getItem(key);
          return { value: v, source:'local', exists:!!v, error:true, firebaseUnavailable:true, firebaseError:e };
        }catch(localErr){
          console.warn('storage.get fallback error', localErr);
          return { value:null, source:'error', exists:false, error:true, firebaseUnavailable:true, firebaseError:e, localError:localErr };
        }
      }
    }
    try{
      const v = localStorage.getItem(key);
      return { value:v, source:'local', exists:!!v, error:true, firebaseUnavailable:true };
    }catch(e){
      console.warn('storage.get error', e);
      return { value:null, source:'error', exists:false, error:true, firebaseUnavailable:true, localError:e };
    }
  },
  async set(key, value){
    if(window.firebase && typeof db !== 'undefined' && db){
      try{
        await db.collection('app_state').doc(key).set({
          value:value,
          updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        FIREBASE_LAST_ERROR = null;
        return { ok:true, source:'firebase' };
      }catch(e){
        FIREBASE_LAST_ERROR = e;
        console.warn('firebase.set error', e);
      }
    }
    try{
      localStorage.setItem(key, value);
      return { ok:true, source:'local', error:true };
    }catch(e){
      console.warn('storage.set error', e);
      return { ok:false, source:'none', error:true, errorObject:e };
    }
  }
};
/* ---------- helpers ---------- */
const uid = () => 'id_' + Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
const daysAgoISO = (n) => { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const fmtDate = (iso) => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtDateFull = (iso) => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtDateTime = (iso) => {
  if(!iso) return '—';
  const d = new Date(iso);
  const datePart = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
  const timePart = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return `${datePart} às ${timePart}`;
};
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const isValidSheet = (value) => Number.isFinite(Number(value)) && Number.isInteger(Number(value)) && Number(value)>=0 && Number(value)<=200;
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function touch(student){ student.updatedAt = new Date().toISOString(); }
function loadTheme(){
  try{
    const saved = localStorage.getItem(THEME_STORAGE_KEY);
    THEME = saved === 'light' ? 'light' : 'dark';
  }catch(e){ THEME = 'dark'; }
}
function applyTheme(){
  document.body.classList.toggle('theme-light', THEME === 'light');
  document.body.setAttribute('data-theme', THEME);
}
function setTheme(theme){
  THEME = theme === 'light' ? 'light' : 'dark';
  try{ localStorage.setItem(THEME_STORAGE_KEY, THEME); }catch(e){}
  applyTheme();
  render();
}
function renderThemeToggle(){
  const nextTheme = THEME==='dark' ? 'light' : 'dark';
  const icon = THEME==='dark' ? '☀️' : '🌙';
  const label = THEME==='dark' ? 'Ativar modo claro' : 'Ativar modo escuro';
  return `<button class="theme-toggle" data-theme-toggle="${nextTheme}" aria-label="${label}" title="${label}">${icon}</button>`;
}

/* ---------- estrutura de estágios e blocos ---------- */
const BLOCKS_PER_STAGE = 20;
function stagePoint(stage, sheet){
  const idx = STAGES.indexOf(stage);
  const safeIdx = idx===-1 ? 0 : idx;
  return safeIdx*BLOCKS_PER_STAGE + Math.round(Number(sheet)/10);
}
function blockLabelForPoint(point){
  const stageIdx = clamp(Math.floor((point-1)/BLOCKS_PER_STAGE), 0, STAGES.length-1);
  const blockInStage = ((point-1) % BLOCKS_PER_STAGE) + 1;
  const rangeStart = (blockInStage-1)*10 + 1;
  return `${STAGES[stageIdx]}${rangeStart}`;
}
function buildBlocks(startStage, startSheet, targetStage, targetSheet){
  const startPoint = stagePoint(startStage, startSheet);
  const targetPoint = stagePoint(targetStage, targetSheet);
  const total = Math.max(1, Math.abs(targetPoint - startPoint));
  const dir = targetPoint >= startPoint ? 1 : -1;
  const blocks = [];
  for(let i=1;i<=total;i++){
    const point = startPoint + dir*i;
    blocks.push({ index:i, label: blockLabelForPoint(point), status:'not_done', doneDate:null, correctedDate:null, onTime:null, forgotten:false, forgottenDate:null, forgottenNote:'' });
  }
  return { total, blocks };
}
function updateStudentTarget(student, newTargetStage, newTargetSheet, newTargetEnd){
  const startPoint = stagePoint(student.startStage, student.startSheet);
  const newTargetPoint = stagePoint(newTargetStage, newTargetSheet);
  const newDir = newTargetPoint >= startPoint ? 1 : -1;
  const newTotal = Math.max(1, Math.abs(newTargetPoint - startPoint));
  const oldTotal = student.blocks.length;

  if(newTotal > oldTotal){
    for(let i=oldTotal+1; i<=newTotal; i++){
      const point = startPoint + newDir*i;
      student.blocks.push({ index:i, label: blockLabelForPoint(point), status:'not_done', doneDate:null, correctedDate:null, onTime:null, forgotten:false, forgottenDate:null, forgottenNote:'' });
    }
  } else if(newTotal < oldTotal){
    student.blocks = student.blocks.slice(0, newTotal);
  }

  student.totalBlocks = newTotal;
  student.targetStage = newTargetStage;
  student.targetSheet = Number(newTargetSheet);
  student.targetEnd = newTargetEnd;
}
function archiveCurrentMeta(student){
  if(!student.metaHistory) student.metaHistory = [];
  const undoSnapshot = JSON.parse(JSON.stringify(student));
  const s = stats(student);
  const reached = s.total>0 && s.done===s.total;
  const periodStart = student.startDate, periodEnd = todayISO();
  const entry = {
    id: uid(),
    startStage: student.startStage, startSheet: student.startSheet, startDate: student.startDate,
    targetStage: student.targetStage, targetSheet: student.targetSheet, targetEnd: student.targetEnd,
    status: 'completed',
    archivedAt: todayISO(),
    archivedAtTime: new Date().toISOString(),
    blocksCompleted: s.done,
    blocksTotal: s.total,
    reached,
    balance: {
      sheets: sheetsInRange(student, periodStart, periodEnd),
      days: attendanceInRange(student, periodStart, periodEnd),
      percent: s.percent
    },
    undoSnapshot
  };
  student.metaHistory.push(entry);
  return entry;
}
async function undoTrimester(studentId, entryId){
  const idx = DATA.students.findIndex(s=>s.id===studentId);
  if(idx<0) return;
  const entry = (DATA.students[idx].metaHistory || []).find(e=>e.id===entryId);
  if(!entry || !entry.undoSnapshot){
    UNDO_TRIMESTER_CONFIRM = null;
    showToast('Não é possível desfazer esse encerramento (é de antes dessa opção existir).');
    render();
    return;
  }
  DATA.students[idx] = JSON.parse(JSON.stringify(entry.undoSnapshot));
  TB_MODAL = null;
  UNDO_TRIMESTER_CONFIRM = null;
  EDIT_STUDENT_MODE = false;
  const saved = await saveData();
  if(saved && saved.ok && saved.source === 'firebase'){
    showToast('Encerramento desfeito e salvo na nuvem.');
  }else if(saved && saved.ok){
    showToast('Encerramento desfeito neste dispositivo, mas não foi salvo no Firebase. Verifique a conexão antes de sair.');
  }else{
    showToast('Atenção: não foi possível confirmar o salvamento. Verifique o Firebase antes de sair.');
  }
  render();
}
function stats(student){
  const blocks = student.blocks;
  const total = student.totalBlocks;
  const done = blocks.filter(b=>b.status!=='not_done').length;
  const corrected = blocks.filter(b=>b.status==='corrected').length;
  const pending = blocks.filter(b=>b.status==='pending_correction').length;
  const percent = total>0 ? Math.round((done/total)*100) : 0;
  const daysRemaining = daysBetween(todayISO(), student.targetEnd);
  const goalReached = total>0 && done===total;
  const correctionRatio = done>0 ? corrected/done : 0;
  const sheetsCompleted = done*10;
  return { total, done, corrected, pending, percent, daysRemaining, goalReached, correctionRatio, sheetsCompleted };
}
function weeklyDelta(student){
  const h = (student.weeklyHistory || []).slice().sort((a,b)=> (b.endDate||'').localeCompare(a.endDate||''));
  if(h.length===0) return { thisWeek:0, lastWeek:0, delta:0 };
  const thisWeek = h[0].sheets;
  const lastWeek = h.length>1 ? h[1].sheets : 0;
  return { thisWeek, lastWeek, delta: thisWeek-lastWeek };
}
function withCompetitionRank(sortedList, valueFn){
  let rank=0, prevVal=null;
  return sortedList.map((item,idx)=>{
    const v = valueFn(item);
    if(prevVal===null || v!==prevVal){ rank += 1; prevVal = v; }
    return { item, rank, tied: false };
  }).map((row,idx,arr)=> ({ ...row, tied: arr.some((o,j)=> j!==idx && o.rank===row.rank) }));
}

function getUnseenTrimesterBalance(student){
  const completed = (student.metaHistory || []).filter(h=>h.status==='completed' && h.balance).sort((a,b)=> (b.archivedAtTime||b.archivedAt||'').localeCompare(a.archivedAtTime||a.archivedAt||''));
  if(completed.length===0) return null;
  const latest = completed[0];
  if(student.lastSeenBalanceId === latest.id) return null;
  return latest;
}
function hallRankMark(rank){
  const medals = {1:'🥇',2:'🥈',3:'🥉'};
  return medals[rank] ? `<span class="hall-rank medal">${medals[rank]}</span>` : `<span class="hall-rank">${rank}</span>`;
}
function streakStats(student){
  const attendance = student.attendance || {};
  // Após encerrar o trimestre, a contagem recomeça na data de início da nova meta
  // (os dias continuam salvos no calendário e no histórico).
  const from = student.constancyStart || '';
  return { total: Object.keys(attendance).filter(d=> !from || d >= from).length };
}
function isRecentlyActive(student){
  const dates = Object.keys(student.attendance || {});
  if(dates.length===0) return false;
  const today = todayISO();
  return dates.some(d => daysBetween(d, today) <= 14);
}
const BLOCKS_PER_REWARD = 3;
function rewardStats(student){
  const s = stats(student);
  const earned = Math.floor(s.corrected / BLOCKS_PER_REWARD);
  const rewards = student.rewards || {};
  let given = 0;
  for(let i=0;i<earned;i++){ if(rewards[i]) given++; }
  const pending = earned - given;
  const remaining = BLOCKS_PER_REWARD - (s.corrected % BLOCKS_PER_REWARD);
  return { earned, given, pending, remaining };
}
function renderRewardDots(student){
  const s = stats(student);
  const posInCycle = s.corrected % BLOCKS_PER_REWARD;
  let dots = '';
  for(let i=0;i<BLOCKS_PER_REWARD;i++){
    dots += `<span class="reward-dot ${i<posInCycle?'filled':''}"></span>`;
  }
  return `<div class="reward-dots">${dots}</div>`;
}
function showToast(msg){
  if(SAVE_FAILURE_PENDING){
    msg = '⚠️ Firebase indisponível: a alteração ficou somente neste dispositivo.';
    SAVE_FAILURE_PENDING = false;
  }
  TOAST = msg; render();
  setTimeout(()=>{ TOAST=null; render(); }, 3000);
}

/* ---------- persistência usando localStorage / Firestore ---------- */
const BACKUP_COLLECTION = 'app_backups';
const BACKUP_RETENTION_DAYS = 90;

async function saveDailyBackup(){
  if(!(window.firebase && typeof db !== 'undefined' && db) || !DATA) return false;
  try{
    await db.collection(BACKUP_COLLECTION).doc(todayISO()).set({
      value:JSON.stringify(DATA),
      savedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){
    console.warn('saveDailyBackup error', e);
    return false;
  }
}
async function cleanupOldBackups(){
  if(!(window.firebase && typeof db !== 'undefined' && db)) return;
  const cutoff = daysAgoISO(BACKUP_RETENTION_DAYS);
  try{
    while(true){
      const snap = await db.collection(BACKUP_COLLECTION)
        .where(firebase.firestore.FieldPath.documentId(), '<', cutoff)
        .limit(400).get();
      if(snap.empty) break;
      const batch = db.batch();
      snap.docs.forEach(doc=>batch.delete(doc.ref));
      await batch.commit();
      if(snap.size < 400) break;
    }
  }catch(e){ console.warn('cleanupOldBackups error', e); }
}
async function saveManualSnapshot(dataObj, tag){
  if(!(window.firebase && typeof db !== 'undefined' && db)) return false;
  try{
    await db.collection('app_snapshots').doc(`snap_${Date.now()}_${tag||'manual'}`).set({
      value:JSON.stringify(dataObj),
      savedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){ console.warn('saveManualSnapshot error', e); return false; }
}
async function getLatestBackup(){
  if(!(window.firebase && typeof db !== 'undefined' && db)) return null;
  try{
    const snap = await db.collection(BACKUP_COLLECTION)
      .orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(1).get();
    if(!snap.empty){
      const d=snap.docs[0].data();
      return {id:snap.docs[0].id, data:JSON.parse(d.value), savedAt:d.savedAt};
    }
  }catch(e){ console.warn('getLatestBackup error', e); }
  return null;
}
async function listRecentBackups(limitN){
  if(!(window.firebase && typeof db !== 'undefined' && db)) return [];
  try{
    const snap=await db.collection(BACKUP_COLLECTION)
      .orderBy(firebase.firestore.FieldPath.documentId(), 'desc').limit(limitN||30).get();
    return snap.docs.map(doc=>({id:doc.id,savedAt:doc.data().savedAt}));
  }catch(e){ console.warn('listRecentBackups error', e); return []; }
}
async function getBackupById(id){
  if(!(window.firebase && typeof db !== 'undefined' && db)) return null;
  try{
    const doc=await db.collection(BACKUP_COLLECTION).doc(id).get();
    if(doc.exists) return JSON.parse(doc.data().value);
  }catch(e){ console.warn('getBackupById error', e); }
  return null;
}

async function loadData(){
  let firebaseMissing=false;
  try{
    const res=await storage.get(STORAGE_KEY);
    if(res && res.value){
      DATA=JSON.parse(res.value);
      DATA_SOURCE = res.source==='firebase' ? 'firebase' : 'local';
      firebaseMissing = res.source!=='firebase' && !!res.firebaseUnavailable;
      migrateAttendance();
      migrateWeeklyHistory();
      const cleaned = cleanupExpiredForgottenReminders();
      if(cleaned){ await saveData(); }
      if(firebaseMissing){
        LOGIN_ERROR='Firebase indisponível. Os dados locais foram carregados temporariamente.';
      }
      return;
    }
    if(res && res.source==='firebase' && res.exists===false){
      firebaseMissing=false;
      DATA_SOURCE='firebase_missing';
    }else if(res && res.firebaseUnavailable){
      firebaseMissing=true;
    }
  }catch(e){
    console.warn('Falha ao carregar dados principais', e);
    firebaseMissing=true;
  }

  if(firebaseMissing){
    try{
      const backup=await getLatestBackup();
      if(backup){
        DATA=backup.data; DATA_SOURCE='firebase';
        migrateAttendance(); migrateWeeklyHistory(); cleanupExpiredForgottenReminders();
        showToast('Dados principais indisponíveis: restaurado do último backup automático.');
        return;
      }
    }catch(e){ console.warn('Falha ao tentar recuperar backup automático', e); }
    DATA={students:[]};
    DATA_SOURCE='error';
    LOGIN_ERROR='Não foi possível acessar o banco de dados. Verifique a conexão e as regras do Firebase.';
    return;
  }

  // Somente quando o Firestore respondeu normalmente e o documento realmente não existe,
  // criamos os dados de demonstração da primeira execução.
  DATA=seedDemoData();
  DATA_SOURCE='firebase_missing';
  const saved=await saveData();
  if(!saved.ok) LOGIN_ERROR='Não foi possível inicializar o banco de dados no Firebase.';
}

function cleanupExpiredForgottenReminders(){
  if(!DATA || !Array.isArray(DATA.students)) return false;
  const today=todayISO();
  let changed=false;
  DATA.students.forEach(student=>{
    (student.blocks||[]).forEach(block=>{
      if(block.forgotten && block.forgottenDate && daysBetween(block.forgottenDate,today)>7){
        block.forgotten=false;
        block.forgottenDate=null;
        block.forgottenNote='';
        changed=true;
      }
    });
  });
  return changed;
}
function migrateAttendance(){
  (DATA.students || []).forEach(student=>{
    if(!student.attendance){
      student.attendance = {};
      (student.studyDays || []).forEach(d=>{ student.attendance[d] = 'kumon'; });
    }
  });
}
function migrateWeeklyHistory(){
  (DATA.students || []).forEach(student=>{
    (student.weeklyHistory || []).forEach(h=>{
      if(!h.startDate || !h.endDate){
        const d = h.date || todayISO();
        h.startDate = h.startDate || d;
        h.endDate = h.endDate || d;
      }
      if(!h.id) h.id = uid();
      if(h.note === undefined || h.note === null) h.note = '';
      if(typeof h.sheets === 'string' && h.sheets.trim() !== ''){
        const parsed = Number(h.sheets);
        if(Number.isFinite(parsed)) h.sheets = parsed;
      }
    });
  });
}
async function saveData(){
  const result=await storage.set(STORAGE_KEY, JSON.stringify(DATA));
  SAVE_LAST_STATUS=result && result.ok ? result.source : 'failed';
  SAVE_FAILURE_PENDING = !result || !result.ok || result.source!=='firebase';

  if(result && result.ok && result.source==='firebase'){
    await saveDailyBackup();
    await cleanupOldBackups();
  }
  return result || {ok:false,source:'none'};
}
function seedDemoData(){
  const today = new Date();
  const iso = (d) => d.toISOString().slice(0,10);
  const daysAgo = (n) => { const d=new Date(today); d.setDate(d.getDate()-n); return iso(d); };
  const daysAhead = (n) => { const d=new Date(today); d.setDate(d.getDate()+n); return iso(d); };
  const consecutiveDates = (endOffsetDaysAgo, count) => {
    const arr=[]; for(let k=0;k<count;k++) arr.push(daysAgo(endOffsetDaysAgo+k)); return arr;
  };

  function buildStudent({name, avatar, code, startStage, startSheet, targetStage, targetSheet, startDate, endDate, doneCount, pendingCount, kumonDays, presencialDays, testDays, history, updatedDaysAgo, rewardsPattern, forgottenIndices, forgottenNote, pastMeta, plannedMeta}){
    const { total, blocks } = buildBlocks(startStage, startSheet, targetStage, targetSheet);
    let i=0;
    for(; i<doneCount && i<total; i++){
      blocks[i].status = 'corrected';
      blocks[i].doneDate = daysAgo(30 - i);
      blocks[i].correctedDate = daysAgo(28 - i);
      blocks[i].onTime = true;
    }
    for(let p=0; p<pendingCount && i<total; p++, i++){
      blocks[i].status = 'pending_correction';

    }
    (forgottenIndices || []).forEach(idx=>{
      if(blocks[idx]){ blocks[idx].forgotten = true; blocks[idx].forgottenDate = daysAgo(1); blocks[idx].forgottenNote = forgottenNote || ''; }

  const students = [

      presencialDays:[daysAgo(3), daysAgo(8)],
      testDays:[daysAgo(0)],
      history:[ {startDate:daysAgo(34),endDate:daysAgo(28),sheets:32}, {startDate:daysAgo(27),endDate:daysAgo(21),sheets:38}, {startDate:daysAgo(20),endDate:daysAgo(14),sheets:41}, {startDate:daysAgo(13),endDate:daysAgo(7),sheets:35}, {startDate:daysAgo(7),endDate:daysAgo(1),sheets:42} ],
      plannedMeta: { targetStage:'E', targetSheet:120, targetEnd: daysAhead(90), startStage:'C', startSheet:40, startDate: daysAhead(1) }
    }),
    buildStudent({
      name:'Ana', avatar:'🦋', code:'2222',
      startStage:'E', startSheet:100, targetStage:'F', targetSheet:60,
      startDate:daysAgo(50), endDate:daysAhead(40),
      doneCount:11, pendingCount:2, updatedDaysAgo:2, rewardsPattern:['fini','fini','bombom'],
      kumonDays:[...consecutiveDates(0,6), ...consecutiveDates(16,19)],
      presencialDays:[daysAgo(2), daysAgo(5)],
      history:[ {startDate:daysAgo(34),endDate:daysAgo(28),sheets:28}, {startDate:daysAgo(27),endDate:daysAgo(21),sheets:30}, {startDate:daysAgo(20),endDate:daysAgo(14),sheets:26}, {startDate:daysAgo(13),endDate:daysAgo(7),sheets:33}, {startDate:daysAgo(7),endDate:daysAgo(1),sheets:31} ]
    }),
    buildStudent({
      name:'Pedro', avatar:'🦉', code:'3333',

  return { students };
}

/* =========================================================
   RENDER — roteador principal

function render(){
  const app = document.getElementById('app');
  if(!DATA){ app.innerHTML = renderLoading(); return; }
  cleanupExpiredForgottenReminders();

  if(MAINTENANCE_MODE && SESSION.role === 'student'){ SESSION = {role:null, studentId:null}; }
  let html = '';
  if(SESSION.role === 'student'){
    html = renderStudentApp();
  } else if(SESSION.role === 'admin'){
    html = renderAdminApp();
  } else {
    html = ADMIN_LOGIN_STAGE ? renderAdminLogin() : renderLanding();
  }
  if(TOAST) html += `<div class="toast" role="status" aria-live="polite">${esc(TOAST)}</div>`;
  app.innerHTML = html;
  attachHandlers();
}
function renderLoading(){

function renderTrail(student){
  const blocks = student.blocks || [];
  if(blocks.length===0) return `<p class="muted" style="font-size:12.5px;margin:6px 0;">Os blocos da sua meta vão aparecer aqui.</p>`;
  const done = blocks.filter(b=>b.status!=='not_done').length;
  const nextIdx = blocks.findIndex(b=>b.status==='not_done');
  const chips = blocks.map((b,i)=>{
    let cls='tr-chip';
    if(b.status==='corrected'){ cls+=' ok'; }
    else if(b.status==='pending_correction'){ cls+=' wait'; }
    if(i===nextIdx) cls+=' next';
    return `<div class="${cls}" title="Bloco ${esc(b.label)}"><span class="tr-num">${esc(b.label)}</span></div>`;
  }).join('');
  return `
  <div class="tr-head">
    <span class="muted" style="font-size:12.5px;">${done} de ${blocks.length} blocos feitos</span>
    ${nextIdx>=0 ? `<span class="tr-nextlbl">Próximo: <b>${esc(blocks[nextIdx].label)}</b></span>` : `<span class="tr-nextlbl">🎉 Todos feitos!</span>`}
  </div>
  <div class="tr-grid">${chips}</div>
  <div class="tr-legend">
    <span><i class="lg ok"></i>corrigido</span>
    <span><i class="lg wait"></i>aguardando correção</span>
    <span><i class="lg"></i>a fazer</span>
  </div>`;
}

function growthMessage(student){
  const s = stats(student);
  const streak = streakStats(student);
  if(s.goalReached) return 'Você alcançou sua meta! Hora de mirar ainda mais alto. 🚀';
  if(streak.total>=30) return 'Sua constância está impressionante — continue evoluindo!';
  if(streak.total>=14) return 'Você está construindo uma baita constância! 🔥';
  if(s.correctionRatio>=0.9 && s.done>0) return 'Suas correções estão sempre em dia. Isso é mentalidade de crescimento!';
  if(s.percent>=50) return 'Seu progresso está crescendo — siga nesse ritmo!';
  return 'Cada dia de estudo conta. Continue acumulando constância!';
}

function renderHall(student){
  const list = DATA.students;
  const byStreak = [...list].sort((a,b)=>streakStats(b).total-streakStats(a).total || a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
  const byCorrection = [...list].sort((a,b)=> stats(b).correctionRatio - stats(a).correctionRatio || stats(b).done - stats(a).done || a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
  const myStreak = streakStats(student);

  const streakRows = withCompetitionRank(byStreak, st=>streakStats(st).total).map(({item:st, rank, tied})=>`
    <div class="hall-row ${st.id===student.id?'me':''} ${rank<=3?'top3':''}">
      ${hallRankMark(rank)}
      <span class="hall-avatar">${st.avatar}</span>
      <span class="hall-name">${esc(st.name)}${st.id===student.id?' (você)':''}</span>
      <span class="hall-metric" style="color:var(--amber);">🔥 ${streakStats(st).total}</span>
    </div>`).join('');

  const corrRows = withCompetitionRank(byCorrection, st=>Math.round(stats(st).correctionRatio*100)).map(({item:st, rank, tied})=>`
    <div class="hall-row ${st.id===student.id?'me':''} ${rank<=3?'top3':''}">
      ${hallRankMark(rank)}
      <span class="hall-avatar">${st.avatar}</span>
      <span class="hall-name">${esc(st.name)}${st.id===student.id?' (você)':''}</span>
      <span class="hall-metric" style="color:var(--mint);">🧠 ${Math.round(stats(st).correctionRatio*100)}%</span>
    </div>`).join('');

  return `
  <div class="screen">
    <div class="growth-msg">✨ ${esc(growthMessage(student))}</div>

    <div class="section-title">🎯 Constância</div>
    <div class="card">
      <div class="row" style="margin-bottom:14px;">
        <span class="muted" style="font-size:12.5px;">Dias acumulados de Kumon</span>
        <span class="badge badge-amber">🔥 ${myStreak.total} dias</span>
      </div>
      ${streakRows}
    </div>

    <div class="section-title">🧠 Correções em dia</div>
    <div class="card">
      ${corrRows}
    </div>
  </div>`;
}

function monthlyAttendanceHistory(student){
  const attendance = student.attendance || {};
  const monthMap = {};
  Object.keys(attendance).forEach(d=>{
    const ym = d.slice(0,7);
    if(!monthMap[ym]) monthMap[ym] = { kumon:0, presencial:0, teste:0 };
    const type = attendance[d];
    if(monthMap[ym][type]!==undefined) monthMap[ym][type]++;
  });
  return Object.keys(monthMap).sort().reverse().map(ym=>{
    const [y,m] = ym.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const c = monthMap[ym];
    const count = c.kumon + c.presencial + c.teste;
    const pct = daysInMonth>0 ? Math.round((count/daysInMonth)*100) : 0;
    const label = new Date(y, m-1, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
    return { ym, label, count, daysInMonth, pct, kumon:c.kumon, presencial:c.presencial, teste:c.teste };
  });
}

function monthLabelOf(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function monthShortOf(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''); }
function monthEndISO(ym){ const [y,m]=ym.split('-').map(Number); return ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); }
function metaPeriodKeyOf(dateISO){
  if(!dateISO || !/^\d{4}-\d{2}-\d{2}$/.test(dateISO)) return null;
  let [y,m,d] = dateISO.split('-').map(Number);
  if(d < 21){ m--; if(m<1){m=12;y--;} }
  return y+'-'+String(m).padStart(2,'0');
}
function metaPeriodRange(ym){
  const [y,m] = ym.split('-').map(Number);
  const start = ym+'-21';
  let ny=y, nm=m+1; if(nm>12){nm=1;ny++;}
  const end = ny+'-'+String(nm).padStart(2,'0')+'-20';
  return {start,end};
}
function metaPeriodLabel(ym, short=false){
  const r = metaPeriodRange(ym);
  return short ? `${fmtDateFull(r.start)}–${fmtDateFull(r.end)}` : `${fmtDateFull(r.start)} a ${fmtDateFull(r.end)}`;
}
function studentMonthStats(student, ym){
  const range = metaPeriodRange(ym);
  const att = student.attendance || {};
  let kumon=0, presencial=0, teste=0;
  Object.keys(att).forEach(d=>{
    if(d < range.start || d > range.end) return;
    const t = att[d];
    if(t==='kumon') kumon++; else if(t==='presencial') presencial++; else if(t==='teste') teste++;
  });
  const days = kumon+presencial+teste;
  const dim = daysBetween(range.start,range.end)+1;
  return { ym, startDate:range.start, endDate:range.end, kumon, presencial, teste, days, dim,
           pct: dim>0 ? Math.round(days/dim*100) : 0,
           sheets: sheetsInRange(student, range.start, range.end),
           corrected: hallCorrectedInRange(student, range.start, range.end) };
}
// Série contínua por ciclo mensal, de dia 21 a dia 20, em ordem cronológica.
function studentMonthSeries(student){
  const set = new Set();
  Object.keys(student.attendance||{}).forEach(d=>{const k=metaPeriodKeyOf(d);if(k)set.add(k);});
  (student.weeklyHistory||[]).forEach(h=>{
    [h.startDate,h.endDate].forEach(d=>{const k=metaPeriodKeyOf(d);if(k)set.add(k);});
  });
  (student.blocks||[]).forEach(b=>{const k=metaPeriodKeyOf(b.correctedDate);if(k)set.add(k);});
  const all = [...set].filter(x=>/^\d{4}-\d{2}$/.test(x)).sort();
  if(all.length===0) return [];
  const out = [];
  let [y,m] = all[0].split('-').map(Number);
  const last = all[all.length-1];
  for(let guard=0; guard<240; guard++){
    const ym = y+'-'+String(m).padStart(2,'0');
    out.push(studentMonthStats(student, ym));
    if(ym>=last) break;
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function evoCompareLabel(current, previous, key, unit=''){
  const a = Number(current && current[key] || 0), b = Number(previous && previous[key] || 0);
  if(!previous) return 'Ainda sem mês anterior para comparar';
  const delta = a-b;
  if(delta===0) return `Sem alteração em relação ao mês anterior (${a}${unit})`;
  return `${delta>0?'↑ +':'↓ '}${delta}${unit} em relação ao mês anterior`;
}
function evoTrendSummary(months){
  const active = (months||[]).filter(m=>m.days>0 || m.sheets>0 || m.corrected>0).slice(-3);
  if(active.length===0) return { title:'Ainda não há dados suficientes', detail:'Os indicadores aparecerão quando houver registros de presença, folhas ou correções.' };
  if(active.length===1) return { title:'Primeiro mês registrado', detail:`${metaPeriodLabel(active[0].ym)}: ${active[0].days} dias de presença, ${active[0].sheets} folhas e ${active[0].corrected} correções.` };
  const first=active[0], last=active[active.length-1];
  const sheetDelta=last.sheets-first.sheets;
  const dayDelta=last.days-first.days;
  const direction = sheetDelta>0 ? 'aumento' : sheetDelta<0 ? 'redução' : 'estabilidade';
  const attendance = dayDelta>0 ? 'mais dias de presença' : dayDelta<0 ? 'menos dias de presença' : 'o mesmo número de dias de presença';
  return { title:`${direction.charAt(0).toUpperCase()+direction.slice(1)} de folhas no período`, detail:`De ${metaPeriodLabel(first.ym)} a ${metaPeriodLabel(last.ym)}, foram ${Math.abs(sheetDelta)} folhas ${sheetDelta>0?'a mais':sheetDelta<0?'a menos':'de diferença'} e ${attendance} (${last.days} no último mês registrado).` };
}
function evoBars(items, opts){
  opts = opts || {};
  const color = opts.color || 'linear-gradient(180deg,#5AC8FF,var(--mint))';
  const unit = opts.unit || '';
  if(!items.length) return `<span class="muted" style="font-size:13px;">Sem registros ainda.</span>`;
  const mx = Math.max(opts.max||0, 1, ...items.map(i=>i.value));
  return `<div class="bars-scroll"><div class="bars-wrap" style="min-width:${items.length*40}px;">${items.map(i=>`
    <div class="bar-col" title="${esc(i.title||i.label)}">
      <span class="mono" style="font-size:10px;color:var(--text-muted);">${i.value}${unit}</span>
      <div class="bar-fill" style="height:${(i.value/mx*80).toFixed(1)}%;background:${color};${i.value===0?'min-height:2px;opacity:.35;':''}"></div>
      <span class="bar-label">${esc(i.label)}</span>
    </div>`).join('')}</div></div>`;
}
function evoStackedBars(months){
  if(!months.length) return `<span class="muted" style="font-size:13px;">Sem registros ainda.</span>`;
  const mx = Math.max(1, ...months.map(m=>m.days));
  return `<div class="bars-scroll"><div class="bars-wrap" style="min-width:${months.length*40}px;">${months.map(m=>`
    <div class="bar-col" title="${esc(monthLabelOf(m.ym))}: ${m.kumon} Kumon, ${m.presencial} presencial, ${m.teste} teste">
      <span class="mono" style="font-size:10px;color:var(--text-muted);">${m.days}</span>
      <div style="width:100%;height:${(m.days/mx*80).toFixed(1)}%;display:flex;flex-direction:column-reverse;border-radius:6px 6px 3px 3px;overflow:hidden;${m.days===0?'min-height:2px;background:var(--bg-surface-2);':''}">
        ${m.kumon?`<div style="flex:${m.kumon};background:var(--mint);"></div>`:''}
        ${m.presencial?`<div style="flex:${m.presencial};background:#5AC8FF;"></div>`:''}
        ${m.teste?`<div style="flex:${m.teste};background:var(--peri);"></div>`:''}
      </div>
      <span class="bar-label">${esc(monthShortOf(m.ym))}</span>
    </div>`).join('')}</div></div>
    <div class="evo-legend"><span><i style="background:var(--mint)"></i>Kumon</span><span><i style="background:#5AC8FF"></i>Presencial</span><span><i style="background:var(--peri)"></i>Teste</span></div>`;
}
function evoDonut(parts, centerText){
  const total = parts.reduce((a,p)=>a+p.value,0);
  const r=40, C=2*Math.PI*r;
  let off=0;
  const arcs = total>0 ? parts.filter(p=>p.value>0).map(p=>{
    const len = p.value/total*C;
    const el = `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${p.color}" stroke-width="14" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`;
    off += len; return el;
  }).join('') : '';
  return `<svg viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="Situação dos blocos" style="flex-shrink:0;">
    <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--bg-surface-2)" stroke-width="14"/>
    ${arcs}
    <text x="50" y="55" text-anchor="middle" font-size="17" font-weight="700" fill="var(--text)" font-family="'Space Grotesk',sans-serif">${esc(centerText)}</text>
  </svg>`;
}

function renderTrimesterSectionStudent(student){
  const cur = stats(student);

  const route = (a1,a2,b1,b2)=> `<span class="tl-route">${a1?`${esc(a1)}${esc(a2)}<i>➜</i>`:''}<b>${esc(b1)}${esc(b2)}</b></span>`;

  items.push(`

        <div class="tl-dates">${planned.startDate ? fmtDate(planned.startDate)+' → ' : 'até '}${fmtDate(planned.targetEnd)}</div>
      </div>
    </div>`);
  }

  completed.forEach(e=>{
    const pct = e.balance ? e.balance.percent : (e.blocksTotal>0 ? Math.round((e.blocksCompleted/e.blocksTotal)*100) : 0);
    const reached = e.reached !== undefined ? e.reached : e.blocksCompleted===e.blocksTotal;

        <div class="tl-top"><span class="tl-badge ${reached?'win':'end'}">${reached?'🎯 Meta batida':'Encerrada'}</span><span class="tl-pct">${pct}%</span></div>
