        ${e.balance ? `<div class="tl-chips"><span>🔥 ${e.balance.days} ${e.balance.days===1?'dia':'dias'}</span><span>📄 ${e.balance.sheets} ${e.balance.sheets===1?'folha':'folhas'}</span></div>` : ''}
      </div>
    </div>`);
  });

  return `
    <div class="section-title">📜 Trimestres</div>
    <div class="card"><div class="tl">${items.join('')}</div></div>`;
}

function sheetsInRange(student, rangeStart, rangeEnd){
  let total = 0;
  (student.weeklyHistory || []).forEach(h=>{
    const a = h.startDate || h.endDate, b = h.endDate || h.startDate;
    if(!a || !b) return;
    const from = a > rangeStart ? a : rangeStart, to = b < rangeEnd ? b : rangeEnd;
    if(from > to) return;
    total += Number(h.sheets || 0) * (daysBetween(from,to)+1) / (daysBetween(a,b)+1);
  });
  return Math.round(total);
}
function monthSheets(student, ym){
  const [y,m] = ym.split('-').map(Number);
  const mStart = ym+'-01';
  const mEnd = ym+'-'+String(new Date(y, m, 0).getDate()).padStart(2,'0');
  return sheetsInRange(student, mStart, mEnd);
}
function correctedInRange(student, rangeStart, rangeEnd){
  return student.blocks.filter(b=> b.correctedDate && b.correctedDate>=rangeStart && b.correctedDate<=rangeEnd).length;
}
// Correções do Hall: soma as da meta atual + as de metas já encerradas (que ficam guardadas no histórico),
// para o mês/trimestre não "perder" correções depois que o trimestre é encerrado.
function hallCorrectedInRange(student, rangeStart, rangeEnd){
  const inRange = b => b.correctedDate && b.correctedDate>=rangeStart && b.correctedDate<=rangeEnd;
  let n = (student.blocks || []).filter(inRange).length;
  (student.metaHistory || []).forEach(h=>{
    if(h.status==='completed' && h.undoSnapshot && Array.isArray(h.undoSnapshot.blocks)){
      n += h.undoSnapshot.blocks.filter(inRange).length;
    }
  });
  return n;
}
function attendanceInRange(student, rangeStart, rangeEnd){
  return Object.keys(student.attendance || {}).filter(d=> d>=rangeStart && d<=rangeEnd).length;
}
function metasConcluidasInRange(student, rangeStart, rangeEnd){
  return (student.metaHistory || []).filter(h=>
    h.status==='completed' && h.archivedAt && h.archivedAt>=rangeStart && h.archivedAt<=rangeEnd &&
    (h.reached !== undefined ? h.reached : h.blocksCompleted===h.blocksTotal)
  );
}
function hallTrimesterOptions(){
  const options=[];
  const seen=new Set();
  const add=(item,isCurrent=false)=>{
    if(!item || !item.startDate || !item.endDate || item.startDate>item.endDate) return;
    const key=item.startDate+'|'+item.endDate;
    if(seen.has(key)) return;
    seen.add(key);
    options.push({start:item.startDate,end:item.endDate,isCurrent,label:`${fmtDate(item.startDate)} a ${fmtDate(item.endDate)}`});
  };
  const current=DATA.currentTrimester||{};
  add(current,true);
  // Período anterior confirmado pelo orientador.
  add({startDate:'2026-08-01',endDate:'2026-10-20'},false);
  (DATA.trimesterHistory||[]).slice().sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).forEach(item=>add(item,false));
  // Older files did not keep a global trimester archive. Recover available ranges from each student's saved meta history.
  DATA.students.forEach(st=>(st.metaHistory||[]).filter(e=>e.status==='completed').forEach(e=>{
    const end=e.targetEnd||e.archivedAt;
    if(e.startDate && end) add({startDate:e.startDate,endDate:end},false);
  }));
  return options;
}
function hallFolhasRange(){
  if(HALL_PERIOD_MODE==='trimester'){
    const options=hallTrimesterOptions();
    HALL_TRIMESTER_INDEX=Math.max(0,Math.min(HALL_TRIMESTER_INDEX,Math.max(0,options.length-1)));
    const selected=options[HALL_TRIMESTER_INDEX];
    if(!selected) return null;
    return {start:selected.start,end:selected.end,label:selected.label,isCurrent:selected.isCurrent,index:HALL_TRIMESTER_INDEX,total:options.length};
  }
  const ym = HALL_MONTH || metaPeriodKeyOf(todayISO());
  const range = metaPeriodRange(ym);
  return { ...range, label: metaPeriodLabel(ym), ym };
}

  if(HALL_TAB==='streak' || HALL_TAB==='correction'){
    // Constância e Correções respeitam o período escolhido (Mês ou Trimestre), igual às Folhas
    const range = hallFolhasRange();
    if(!range){
      return `<p class="muted center" style="margin:24px 0;font-size:13px;">Defina as datas do trimestre atual em Perfil → Trimestre atual pra ver esse período aqui.</p>`;
    }
    const isStreak = HALL_TAB==='streak';
    const valueOf = (st)=> isStreak ? attendanceInRange(st, range.start, range.end) : hallCorrectedInRange(st, range.start, range.end);
    const sorted = list
      .map(st=>({ st, v: valueOf(st) }))
      .sort((a,b)=> b.v - a.v || a.st.name.localeCompare(b.st.name,'pt-BR',{sensitivity:'base'}));
    const ranked = withCompetitionRank(sorted, r=>r.v);
    return `
      <p class="faint" style="font-size:11.5px;margin:0 0 10px;text-transform:capitalize;">${esc(range.label)}</p>
      <div class="card">${ranked.map(({item:r, rank, tied})=>`
      <div class="hall-row ${rank<=3?'top3':''}" data-open-student="${r.st.id}" style="cursor:pointer;">
        ${hallRankMark(rank)}
        <span class="hall-avatar">${r.st.avatar}</span>
        <span class="hall-name">${esc(r.st.name)}</span>
        <span class="hall-metric" style="color:${isStreak?'var(--amber)':'var(--mint)'};">${isStreak?'🔥':'🧠'} ${r.v}</span>
      </div>`).join('')}</div>`;
  }
  return renderSheetsRanking();
}

function renderAdminTrimesterBalance(){
  const list = DATA.students;
  const trimester = DATA.currentTrimester || {};
  const start = trimester.startDate, end = trimester.endDate;
  const backBtn = `<button class="btn btn-ghost btn-sm no-print" id="btn-balance-back">← Voltar</button>`;

  if(!start || !end){
    return `<div class="screen">
      ${backBtn}
      <p class="muted center" style="margin-top:30px;">Defina as datas do trimestre atual em Perfil → Trimestre atual para ver o balanço.</p>
    </div>`;
  }
  if(list.length===0){
    return `<div class="screen">${backBtn}<p class="muted center" style="margin-top:30px;">Cadastre alunos para ver o balanço do trimestre.</p></div>`;
  }

  const today = todayISO();
  const totalDays = daysBetween(start,end)+1;
  const elapsed = clamp(daysBetween(start, today<end?today:(today>end?end:today))+1, 0, totalDays);
  const timePct = totalDays>0 ? Math.round(clamp(elapsed,0,totalDays)/totalDays*100) : 0;
  const periodLabel = `${fmtDateFull(start)} a ${fmtDateFull(end)}`;

  const rows = list.map(st=>{
    const s = stats(st);
    const archivedDone = metasConcluidasInRange(st, start, end).length;
    const currentlyReached = s.goalReached;
    return {
      st,
      sheets: sheetsInRange(st, start, end),
      days: attendanceInRange(st, start, end),
      corrected: hallCorrectedInRange(st, start, end),
      goalsDone: archivedDone + (currentlyReached ? 1 : 0),
      currentlyReached,
    };
  });
  const totalSheets = rows.reduce((sum,r)=>sum+r.sheets,0);
  const totalCorrected = rows.reduce((sum,r)=>sum+r.corrected,0);
  const totalGoals = rows.reduce((sum,r)=>sum+r.goalsDone,0);
  const avgProgress = Math.round(list.reduce((sum,s)=>sum+stats(s).percent,0)/list.length);

  const bySheets = rows.slice().sort((a,b)=> b.sheets-a.sheets || a.st.name.localeCompare(b.st.name,'pt-BR',{sensitivity:'base'}));
  const byDays = rows.slice().sort((a,b)=> b.days-a.days || a.st.name.localeCompare(b.st.name,'pt-BR',{sensitivity:'base'}));
  const byCorrected = rows.slice().sort((a,b)=> b.corrected-a.corrected || a.st.name.localeCompare(b.st.name,'pt-BR',{sensitivity:'base'}));

  const winnerBlock = (title, rankedList, key, unit, color) => {
    const max = rankedList.length ? rankedList[0][key] : 0;
    const winners = max>0 ? rankedList.filter(r=>r[key]===max) : [];
    return `
    <div class="section-title">${title}</div>
    <div class="card report-winner">
      ${winners.length===0 ? `<span class="muted" style="font-size:13px;">Sem registros neste trimestre.</span>` : `
        <div class="avatars">${winners.map(r=>`<div class="w"><div class="av">${r.st.avatar}</div><div class="nm">${esc(r.st.name)}</div></div>`).join('')}</div>
        <div class="mono" style="font-weight:700;font-size:18px;color:${color};">${max} ${unit}</div>`}
    </div>`;
  };

  const metGoalList = [];
  rows.forEach(r=>{
    metasConcluidasInRange(r.st, start, end).forEach(e=> metGoalList.push({ st: r.st, archived: true, archivedAt: e.archivedAt }));
    if(r.currentlyReached) metGoalList.push({ st: r.st, archived: false });
  });
  metGoalList.sort((a,b)=> a.st.name.localeCompare(b.st.name,'pt-BR',{sensitivity:'base'}));

  return `
  <div class="screen">
    <div class="no-print" style="margin-bottom:10px;">${backBtn}</div>

    <div class="center" style="margin-bottom:4px;">
      <div class="display" style="font-size:20px;font-weight:700;">📊 Balanço do trimestre</div>
      <div class="faint" style="font-size:12px;margin-top:2px;">${esc(periodLabel)}</div>
    </div>
    <div class="mini-track" style="margin:12px 0 4px;"><div class="mini-fill" style="width:${timePct}%;"></div></div>
    <p class="faint" style="font-size:11px;text-align:center;margin-bottom:18px;">${timePct}% do trimestre decorrido</p>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" style="color:var(--peri);">${totalSheets}</div><div class="stat-label">Folhas no trimestre</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--mint);">${totalCorrected}</div><div class="stat-label">Blocos corrigidos</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--amber);">${totalGoals}</div><div class="stat-label">Metas concluídas</div></div>
      <div class="stat-card"><div class="stat-num">${avgProgress}%</div><div class="stat-label">Progresso médio atual</div></div>
    </div>

    ${winnerBlock('📄 Quem mais fez folhas', bySheets, 'sheets', 'folhas', 'var(--peri)')}
    ${winnerBlock('🔥 Quem mais fez Kumon', byDays, 'days', 'dias', 'var(--amber)')}
    ${winnerBlock('🧠 Quem mais fez correção', byCorrected, 'corrected', 'correções', 'var(--mint)')}

    <div class="section-title">🎯 Alunos que bateram a meta</div>
    ${metGoalList.length===0 ? `
    <div class="card"><span class="muted" style="font-size:13px;">Ninguém bateu a meta neste trimestre ainda.</span></div>` : `
    <div class="card" style="border-color:#8C93FF55;">
      ${metGoalList.map(r=>`
      <div class="hall-row" data-open-student="${r.st.id}" style="cursor:pointer;">
        <span class="hall-avatar">${r.st.avatar}</span>
        <span class="hall-name">${esc(r.st.name)}</span>
      </div>`).join('')}
    </div>`}


    <button class="btn btn-primary btn-block no-print" id="btn-balance-print" style="margin-top:6px;">🖨️ Imprimir / salvar em PDF</button>
  </div>`;
}

function renderCalendar(student, readOnly){
  if(!CALENDAR_MONTH){
    const now = new Date();
    CALENDAR_MONTH = { year: now.getFullYear(), month: now.getMonth() };
  }
  const { year, month } = CALENDAR_MONTH;
  const attendance = student.attendance || {};
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
  const todayIso = todayISO();
  const weekdayLabels = ['D','S','T','Q','Q','S','S'];

  let cells = '';
  let markedCount = 0, kumonCount = 0, presencialCount = 0, testeCount = 0;
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const cellIso = dateObj.toISOString().slice(0,10);
    const type = attendance[cellIso];
    const isToday = cellIso===todayIso;
    let cls = 'cal-cell';
    if(type==='kumon'){ cls += ' marked-kumon'; markedCount++; kumonCount++; }
    else if(type==='presencial'){ cls += ' marked-presencial'; markedCount++; presencialCount++; }
    else if(type==='teste'){ cls += ' marked-teste'; markedCount++; testeCount++; }
    if(isToday) cls += ' today';
    const label = type==='teste' ? 'dia de teste' : (type==='presencial' ? 'veio para a unidade' : (type==='kumon' ? 'fez o Kumon' : 'sem marcação'));
    cells += readOnly
      ? `<button type="button" class="${cls}" tabindex="-1" style="pointer-events:none;cursor:default;" aria-label="${d}, ${label}" title="${label}">${d}</button>`
      : `<button class="${cls}" data-cal-day="${cellIso}" aria-label="${d}, ${label}" title="${label}">${d}</button>`;
  }
  const monthPct = daysInMonth>0 ? Math.round((markedCount/daysInMonth)*100) : 0;

  return `
    <div class="cal-header">
      <button class="icon-btn" id="btn-cal-prev" aria-label="Mês anterior">‹</button>
      <span class="cal-month-label">${esc(monthLabel)}</span>
      <button class="icon-btn" id="btn-cal-next" aria-label="Próximo mês">›</button>
    </div>
    <div class="cal-summary">
      <div class="cal-summary-main">
        <span class="cal-summary-pct">${monthPct}%</span>
        <span class="cal-summary-label">${markedCount} de ${daysInMonth} dias do mês</span>
      </div>
      <div class="cal-summary-track"><div class="cal-summary-fill" style="width:${monthPct}%;"></div></div>
      <div class="cal-summary-breakdown">
        <span>🟢 ${kumonCount} Kumon</span>
        <span>🔵 ${presencialCount} presencial</span>
        <span>🟣 ${testeCount} teste</span>
      </div>
    </div>
    <div class="cal-weekdays">${weekdayLabels.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">
      <span><span class="cal-dot" style="background:var(--mint);"></span>fez o Kumon</span>
      <span><span class="cal-dot" style="background:var(--sky);"></span>veio para a unidade</span>

function normTxt(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function evoSelectedId(){
  const list = DATA.students;
  if(list.length===0) return null;
  return SELECTED_STUDENT_ID && list.find(s=>s.id===SELECTED_STUDENT_ID) ? SELECTED_STUDENT_ID : list[0].id;
}
function evoResultsHtml(){
  const selectedId = evoSelectedId();
  const term = normTxt(EVO_SEARCH.trim());
  if(!term) return '';
  const list = DATA.students.filter(s=> normTxt(s.name).includes(term))
    .slice().sort((a,b)=> a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
  if(list.length===0) return `<p class="muted" style="font-size:13px;margin:10px 0 0;">Nenhum aluno encontrado.</p>`;
  return `<div class="evo-student-results" role="listbox" aria-label="Resultados da pesquisa de alunos">${list.map(st=>`
    <button type="button" class="evo-student-result ${st.id===selectedId?'active':''}" data-evo-pick="${st.id}" role="option" aria-selected="${st.id===selectedId}">
      <span class="evo-result-avatar">${esc(st.avatar||'🙂')}</span>
      <span class="evo-result-info"><strong>${esc(st.name)}</strong><small>${esc(st.startStage)}${esc(st.startSheet)} → ${esc(st.targetStage)}${esc(st.targetSheet)}</small></span>
      <span class="evo-result-action">${st.id===selectedId?'Selecionado':'Ver evolução'} <span aria-hidden="true">›</span></span>
    </button>`).join('')}</div>`;
}
function renderAdminEvolution(){
  const list = DATA.students;
  if(list.length===0) return `<div class="screen"><p class="muted center">Cadastre um aluno para ver a evolução.</p></div>`;
  const student = list.find(s=>s.id===evoSelectedId());
  const s = stats(student);
  const streak = streakStats(student);
  const rw = rewardStats(student);
  const wd = weeklyDelta(student);
  const hist = (student.weeklyHistory||[]).slice().sort((a,b)=> (a.endDate||'').localeCompare(b.endDate||'')).slice(-12);
  const months = studentMonthSeries(student).slice(-12);
  const activeMonths = months.filter(m=>m.days>0 || m.sheets>0 || m.corrected>0);
  const latestMonth = activeMonths.length ? activeMonths[activeMonths.length-1] : null;
  const previousMonth = activeMonths.length>1 ? activeMonths[activeMonths.length-2] : null;
  const trend = evoTrendSummary(months);
  const notDone = Math.max(0, s.total - s.done);
  const shortDate = d => d ? d.slice(8,10)+'/'+d.slice(5,7) : '';

  return `
  <div class="screen">
    <input class="search-input" id="evo-search" placeholder="🔍 Buscar aluno pelo nome…" value="${esc(EVO_SEARCH)}" aria-label="Buscar aluno" autocomplete="off">

          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-open-student="${student.id}">Abrir perfil</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" style="color:var(--amber);">🔥 ${streak.total}</div><div class="stat-label">Dias de constância</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--peri);">${s.sheetsCompleted}</div><div class="stat-label">Folhas na meta atual</div></div>
    </div>

    <div class="section-title">🎯 Blocos da meta</div>
    <div class="card">
      <div class="row" style="justify-content:flex-start;gap:16px;">
        ${evoDonut([
          { value:s.corrected, color:'var(--mint)' },
          { value:s.pending, color:'var(--amber)' },
          { value:notDone, color:'var(--text-faint)' }

          <div>🟢 <b>${s.corrected}</b> corrigidos</div>
          <div>🟡 <b>${s.pending}</b> aguardando correção</div>
          <div>⚪ <b>${notDone}</b> a fazer</div>

        </div>
      </div>
    </div>

    <div class="section-title">📄 Folhas por período</div>
    <div class="card">
      ${evoBars(hist.map(h=>({ label: shortDate(h.endDate), value: Number(h.sheets||0), title: fmtDate(h.startDate)+' – '+fmtDate(h.endDate)+(h.note?' · '+h.note:'') })))}
      ${hist.length>=2 ? `<div class="faint" style="font-size:11.5px;margin-top:8px;">Último período: <b>${wd.thisWeek}</b> folhas · anterior: <b>${wd.lastWeek}</b> ${wd.delta>0?'📈 +'+wd.delta:(wd.delta<0?'📉 '+wd.delta:'➖')}</div>` : ''}
    </div>

    <div class="section-title">📅 Folhas por ciclo mensal</div>
    <div class="card">
      ${evoBars(months.map(m=>({ label: metaPeriodLabel(m.ym, true), value: m.sheets, title: metaPeriodLabel(m.ym) })), { color:'linear-gradient(180deg,var(--peri),#5AC8FF)' })}

    <div class="card">${evoStackedBars(months)}</div>

      ${evoBars(months.map(m=>({ label: metaPeriodLabel(m.ym, true), value: m.corrected, title: metaPeriodLabel(m.ym) })), { color:'linear-gradient(180deg,var(--mint),#2FBF86)' })}

    <div class="section-title">📊 Comparativo entre ciclos mensais</div>
    <div class="card">
      ${!latestMonth ? `<div class="empty-history"><span>📈</span><b>Aguardando os primeiros registros</b><small>Assim que houver dados, será possível comparar os meses.</small></div>` : `

    </div>



  </div>`;
}

function attachHandlers(){
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  // Landing
  if($('#btn-enter-code')){
    $('#btn-enter-code').onclick = handleStudentLogin;
    $('#student-code-input').addEventListener('keydown', e=>{ if(e.key==='Enter') handleStudentLogin(); });
  }
  if($('#btn-go-admin')) $('#btn-go-admin').onclick = ()=>{ ADMIN_LOGIN_STAGE=true; LOGIN_ERROR=''; render(); };
  if($('#btn-back-landing')) $('#btn-back-landing').onclick = ()=>{ ADMIN_LOGIN_STAGE=false; LOGIN_ERROR=''; render(); };

  // Tema
  $$('[data-theme-toggle]').forEach(btn=> btn.onclick = ()=> setTheme(btn.getAttribute('data-theme-toggle')));
  if($('#btn-enter-admin')){
    $('#btn-enter-admin').onclick = handleAdminLogin;
    $('#admin-email-input').addEventListener('keydown', e=>{ if(e.key==='Enter') handleAdminLogin(); });
    $('#admin-pass-input').addEventListener('keydown', e=>{ if(e.key==='Enter') handleAdminLogin(); });
  }

  // Logout
  if($('#btn-logout')) $('#btn-logout').onclick = async ()=>{
    try{ if(auth && SESSION.role==='admin') await auth.signOut(); }catch(e){ console.warn('Erro ao sair do Firebase Authentication', e); }
    SESSION={role:null,studentId:null}; ADMIN_LOGIN_STAGE=false; ADMIN_VIEW='overview'; STUDENT_VIEW='journey'; LOGIN_ERROR=''; render();
  };

  // Student nav
  $$('[data-nav]').forEach(btn=> btn.onclick = ()=>{ STUDENT_VIEW = btn.getAttribute('data-nav'); render(); });

  if($('#btn-admin-profile')) $('#btn-admin-profile').onclick = ()=>{ ADMIN_VIEW='profile'; render(); };

function handleStudentLogin(){
  CALENDAR_MONTH = null;
  const code=document.getElementById('student-code-input').value.trim();
  if(!/^\d+$/.test(code)){
    LOGIN_ERROR='Código deve conter apenas números.';
    render(); return;
  }
  const student=DATA.students.find(s=>s.code===code);
  if(!student){ LOGIN_ERROR='Código não encontrado. Confira com seu orientador.'; render(); return;
  }
  LOGIN_ERROR=''; SESSION={role:'student',studentId:student.id}; STUDENT_VIEW='journey'; render();
  loadPlanResponsesForStudent(student).then(changed=>{ if(changed && SESSION && SESSION.studentId===student.id) render(); });
}
async function handleAdminLogin(){
  const now=Date.now();
  if(now<ADMIN_LOGIN_LOCK_UNTIL){
    const secs=Math.ceil((ADMIN_LOGIN_LOCK_UNTIL-now)/1000);
    LOGIN_ERROR=`Acesso bloqueado. Tente novamente em ${secs}s.`;
    render();
    if(ADMIN_LOGIN_LOCK_TIMER) clearTimeout(ADMIN_LOGIN_LOCK_TIMER);
    ADMIN_LOGIN_LOCK_TIMER=setTimeout(()=>{ LOGIN_ERROR=''; render(); }, Math.max(500, ADMIN_LOGIN_LOCK_UNTIL-now+50));
    return;
  }

  const email=(document.getElementById('admin-email-input')?.value || '').trim();
  const pass=(document.getElementById('admin-pass-input')?.value || '');
  if(!email || !/^\S+@\S+\.\S+$/.test(email)){
    LOGIN_ERROR='Digite um e-mail válido.';
    render();
    return;
  }
  if(!pass){
    LOGIN_ERROR='Digite sua senha.';
    render();
    return;
  }
  if(!auth){
    LOGIN_ERROR='O serviço de autenticação não está disponível. Verifique a conexão e o Firebase.';
    render();
    return;
  }

  try{
    try{ await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}
    await auth.signInWithEmailAndPassword(email,pass);
    ADMIN_LOGIN_ATTEMPTS=0;
    ADMIN_LOGIN_LOCK_UNTIL=0;
    LOGIN_ERROR='';
    ADMIN_LOGIN_STAGE=false;
    SESSION={role:'admin',studentId:null};
    ADMIN_VIEW='overview';
    render();
  }catch(e){
    console.warn('Falha no login do orientador', e);
    ADMIN_LOGIN_ATTEMPTS++;
    if(ADMIN_LOGIN_ATTEMPTS>=3){
      ADMIN_LOGIN_ATTEMPTS=0;
      ADMIN_LOGIN_LOCK_UNTIL=Date.now()+10000;
      LOGIN_ERROR='3 tentativas incorretas. Acesso bloqueado por 10 segundos.';
      render();
      ADMIN_LOGIN_LOCK_TIMER=setTimeout(()=>{ LOGIN_ERROR=''; render(); }, 10050);
    }else{
      const code=e && e.code ? e.code : '';
      if(code==='auth/invalid-email') LOGIN_ERROR='E-mail inválido.';
      else if(code==='auth/too-many-requests') LOGIN_ERROR='Muitas tentativas. Aguarde e tente novamente.';
      else LOGIN_ERROR=`E-mail ou senha incorretos. Tentativa ${ADMIN_LOGIN_ATTEMPTS} de 3.`;
      render();
    }
  }
}

/* ---------- Alternar status de bloco, adicionar/remover ---------- */
async function toggleBlock(index){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  const block = student.blocks.find(b=>b.index===index);
  const today = todayISO();
  if(block.status==='not_done'){
    block.status='pending_correction'; block.doneDate=today; block.correctedDate=null; block.onTime=null;
  } else if(block.status==='pending_correction'){
    block.status='corrected'; block.correctedDate=today;
    block.onTime = block.doneDate ? daysBetween(block.doneDate, today) <= 14 : true;
    block.forgotten=false; block.forgottenDate=null; block.forgottenNote='';
  } else {
    block.status='not_done'; block.doneDate=null; block.correctedDate=null; block.onTime=null;
    block.forgotten=false; block.forgottenDate=null; block.forgottenNote='';
  }
  touch(student);
  await saveData();
  render();
}
async function addBlock(){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  const startPoint = stagePoint(student.startStage, student.startSheet);
  const nextIndex = student.blocks.length>0 ? Math.max(...student.blocks.map(b=>b.index))+1 : 1;
  const point = startPoint + nextIndex;
  student.blocks.push({ index: nextIndex, label: blockLabelForPoint(point), status:'not_done', doneDate:null, correctedDate:null, onTime:null, forgotten:false, forgottenDate:null, forgottenNote:'' });
  student.totalBlocks = student.blocks.length;
  touch(student);
  await saveData();
  showToast('Bloco adicionado!');
}
async function removeBlock(index){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  student.blocks = student.blocks.filter(b=>b.index!==index);
  student.totalBlocks = student.blocks.length;
  touch(student);
  await saveData();
  render();
}

/* ---------- Proposta / Aceite do aluno (fluxo solicitado) ---------- */
// Justificativa da proposta do aluno: precisa ser uma explicação de verdade
const PROPOSAL_MIN_CHARS = 30;
const PROPOSAL_MIN_WORDS = 5;
const proposalWordCount = (t) => (String(t||'').trim().match(/\S+/g) || []).length;
const proposalNoteOk = (t) => String(t||'').trim().length >= PROPOSAL_MIN_CHARS && proposalWordCount(t) >= PROPOSAL_MIN_WORDS;

// ---- Respostas do aluno às metas planejadas ----
// Ficam numa coleção própria (plan_responses), assim o aluno não precisa sobrescrever o banco inteiro.
const PLAN_RESPONSES = 'plan_responses';
const planResponseDocId = (studentId, entryId) => `${studentId}_${entryId}`;
const hasFirestore = () => !!(window.firebase && typeof db !== 'undefined' && db);
function applyPlanResponse(entry, r){
  if(!entry || !r || entry.studentResponse) return false;
  entry.studentResponse = r.response;
  entry.studentRespondedAt = r.respondedAt || null;
  if(r.response === 'proposed'){
    entry.studentProposal = { proposedStage:r.proposedStage, proposedSheet:r.proposedSheet, note:r.note||'', submittedAt:r.respondedAt||null };
  }
  return true;
}
async function sendPlanResponse(student, entry, response, proposal){
  if(!hasFirestore()) return { ok:false };
  const payload = { studentId:student.id, entryId:entry.id, response, respondedAt:new Date().toISOString() };
  if(proposal){ payload.proposedStage = proposal.proposedStage; payload.proposedSheet = proposal.proposedSheet; payload.note = proposal.note || ''; }
  try{
    await db.collection(PLAN_RESPONSES).doc(planResponseDocId(student.id, entry.id)).set(payload);
    return { ok:true, payload };
  }catch(e){
    console.warn('Falha ao enviar resposta da meta', e);
    FIREBASE_LAST_ERROR = e;
    return { ok:false, error:e };
  }
}
async function loadPlanResponsesForStudent(student){
  if(!hasFirestore()) return false;
  let changed = false;
  for(const entry of (student.metaHistory||[]).filter(e=>e.status==='planned' && !e.studentResponse)){
    try{
      const doc = await db.collection(PLAN_RESPONSES).doc(planResponseDocId(student.id, entry.id)).get();
      if(doc.exists && applyPlanResponse(entry, doc.data())) changed = true;
    }catch(e){ console.warn('Falha ao ler resposta da meta', e); }
  }
  return changed;
}
async function syncPlanResponsesAdmin(){
  if(!hasFirestore() || !auth || !auth.currentUser || !DATA || !DATA.students) return;
  try{
    const snap = await db.collection(PLAN_RESPONSES).get();
    let changed = false;
    snap.forEach(doc=>{
      const r = doc.data() || {};
      const st = DATA.students.find(x=>x.id===r.studentId);
      const entry = st && (st.metaHistory||[]).find(e=>e.id===r.entryId && e.status==='planned');
      if(entry && applyPlanResponse(entry, r)){ touch(st); changed = true; }
    });
    if(changed){
      await saveData();
      if(!EDIT_STUDENT_MODE && !PLAN_META_MODE) render();
    }
  }catch(e){ console.warn('Falha ao sincronizar respostas dos alunos', e); }
}

async function handleStudentAccept(entryId){
  if(!SESSION || SESSION.role!=='student') return;
  const student = DATA.students.find(s=>s.id===SESSION.studentId);
  if(!student) return;
  const entry = (student.metaHistory||[]).find(e=>e.id===entryId && e.status==='planned');
  if(!entry) return;
  if(entry.studentResponse) { showToast('Você já respondeu essa proposta.'); return; }
  const res = await sendPlanResponse(student, entry, 'accepted');
  SAVE_FAILURE_PENDING = false;
  if(!res.ok){ showToast('⚠️ Não foi possível enviar sua resposta agora. Tente de novo em instantes.'); return; }
  applyPlanResponse(entry, res.payload);
  STUDENT_PROPOSAL_MODE = null;
  showToast('Aceite enviado! O orientador já pode ver sua resposta.');
}
async function handleStudentProposeSubmit(entryId){
  if(!SESSION || SESSION.role!=='student') return;
  const student = DATA.students.find(s=>s.id===SESSION.studentId);
  if(!student) return;
  const entry = (student.metaHistory||[]).find(e=>e.id===entryId && e.status==='planned');
  if(!entry) return;
  if(entry.studentResponse) { showToast('Você já respondeu essa proposta.'); return; }

  const stageEl = document.getElementById(`f-prop-stage-${entryId}`);
  const sheetEl = document.getElementById(`f-prop-sheet-${entryId}`);
  const noteEl = document.getElementById(`f-prop-note-${entryId}`);
  if(!stageEl || !sheetEl) { showToast('Erro no formulário. Tente novamente.'); return; }

  const proposedStage = stageEl.value;
  const proposedSheetRaw = sheetEl.value;
  const proposedSheet = Number(proposedSheetRaw);
  const note = (noteEl?.value || '').trim();

  if(proposedSheetRaw==='' || !isValidSheet(proposedSheet)){
    showToast('Informe uma folha válida (0–200).'); return;
  }
  if(!proposalNoteOk(note)){
    const er = document.getElementById(`prop-error-${entryId}`);
    if(er) er.textContent = `Explique melhor o motivo da sua proposta: escreva uma frase com pelo menos ${PROPOSAL_MIN_CHARS} caracteres e ${PROPOSAL_MIN_WORDS} palavras.`;
    else showToast('Escreva a justificativa para enviar sua proposta.');
    if(noteEl) noteEl.focus();
    return;
  }

  // envio único: vai para a coleção de respostas, sem reescrever o banco inteiro
  const res = await sendPlanResponse(student, entry, 'proposed', { proposedStage, proposedSheet, note });
  SAVE_FAILURE_PENDING = false;
  if(!res.ok){ showToast('⚠️ Não foi possível enviar sua proposta agora. Tente de novo em instantes.'); return; }
  applyPlanResponse(entry, res.payload);
  STUDENT_PROPOSAL_MODE = null;
  showToast('Proposta enviada ao orientador.');
}

  const block = student.blocks.find(b=>b.index===EDITING_FORGOT_INDEX);
  const val = document.getElementById('input-forgot-note').value.trim();

/* ---------- Registrar período, editar histórico ---------- */
async function registerWeek(){
  const startInput = document.getElementById('input-week-start');
  const endInput = document.getElementById('input-week-end');
  const sheetsInput = document.getElementById('input-weekly-sheets');
  const noteInput = document.getElementById('input-weekly-note');
  const errEl = document.getElementById('week-error');
  const startDate = startInput.value;
  const endDate = endInput.value;
  const val = Number(sheetsInput.value);
  const note = (noteInput?.value || '').trim();

  if(!startDate || !endDate){ if(errEl) errEl.textContent = 'Informe as duas datas do período.'; return; }
  if(startDate > endDate){ if(errEl) errEl.textContent = 'A data "De" deve ser antes (ou igual) à data "Até".'; return; }
  if(sheetsInput.value==='' || !isValidSheet(val)){ if(errEl) errEl.textContent = 'A quantidade de folhas deve estar entre 0 e 200.'; return; }

  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  if(!student) return;
  student.weeklyHistory.push({ id:uid(), startDate, endDate, sheets: val, note });
  touch(student);
  await saveData();
  showToast('Período registrado!');
}
async function saveWeeklyHistoryEdit(id){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  const entry = student && (student.weeklyHistory || []).find(h=>h.id===id);
  const errEl = document.getElementById(`edit-week-error-${id}`);
  if(!entry){ EDITING_WEEK_HISTORY_ID=null; render(); return; }

  const startDate = document.getElementById(`edit-week-start-${id}`)?.value || '';
  const endDate = document.getElementById(`edit-week-end-${id}`)?.value || '';
  const sheetsRaw = document.getElementById(`edit-week-sheets-${id}`)?.value ?? '';
  const note = (document.getElementById(`edit-week-note-${id}`)?.value || '').trim();
  const sheets = Number(sheetsRaw);

  if(!startDate || !endDate){ if(errEl) errEl.textContent='Informe as duas datas do período.'; return; }
  if(startDate > endDate){ if(errEl) errEl.textContent='A data "De" deve ser antes (ou igual) à data "Até".'; return; }
  if(sheetsRaw==='' || !isValidSheet(sheets)){ if(errEl) errEl.textContent='A quantidade de folhas deve estar entre 0 e 200.'; return; }

  entry.startDate = startDate;
  entry.endDate = endDate;
  entry.sheets = sheets;
  entry.note = note;
  touch(student);
  await saveData();
  EDITING_WEEK_HISTORY_ID=null;
  showToast('Histórico atualizado!');
  render();
}

/* ---------- Recompensas ---------- */
async function setRewardCandy(index, candy){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  if(!student.rewards) student.rewards = {};
  student.rewards[index] = (student.rewards[index] === candy) ? undefined : candy;
  if(student.rewards[index] === undefined) delete student.rewards[index];
  touch(student);
  await saveData();
  render();
}
async function saveBlockLabels(){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  document.querySelectorAll('[data-block-label-input]').forEach(input=>{
    const idx = parseInt(input.getAttribute('data-block-label-input'));
    const block = student.blocks.find(b=>b.index===idx);
    const val = input.value.trim();
    if(block && val) block.label = val;
  });
  touch(student);
  await saveData();
  EDIT_LABELS_MODE = false;
  showToast('Números atualizados!');
}
async function saveStudentEdit(){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  const errEl = document.getElementById('edit-student-error');

  const name = document.getElementById('f-edit-name').value.trim();
  const code = document.getElementById('f-edit-code').value.trim();
  const avatar = document.querySelector('#avatar-picker-edit .avatar-opt.sel')?.getAttribute('data-avatar-edit') || student.avatar;

  const startStage = document.getElementById('f-edit-start-stage').value;
  const startSheetRaw = document.getElementById('f-edit-start-sheet').value;
  const startDate = document.getElementById('f-edit-start-date').value;

  const targetStage = document.getElementById('f-edit-target-stage').value;
  const targetSheetRaw = document.getElementById('f-edit-target-sheet').value;
  const targetDate = document.getElementById('f-edit-target-date').value;

  if(!name || !/^\d+$/.test(code) || startSheetRaw==='' || !startDate || targetSheetRaw==='' || !targetDate || !isValidSheet(startSheetRaw) || !isValidSheet(targetSheetRaw)){
    if(errEl) errEl.textContent = 'Preencha os campos corretamente. As folhas devem estar entre 0 e 200.';
    return;
  }
  if(DATA.students.some(s=>s.code===code && s.id!==student.id)){
    if(errEl) errEl.textContent = 'Este código já está em uso por outro aluno.';
    return;
  }

  const startSheet = Number(startSheetRaw);
  const targetSheet = Number(targetSheetRaw);
  const startChanged = (startStage !== student.startStage) || (startSheet !== student.startSheet);

  student.name = name;
  student.code = code;
  student.avatar = avatar;

  // O material didático (blocos, números e status) NÃO é alterado ao mudar a meta.
  student.targetStage = targetStage;
  student.targetSheet = targetSheet;
  student.targetEnd = targetDate;
  student.startStage = startStage;
  student.startSheet = startSheet;
  student.startDate = startDate;
  student.targetStart = startDate;

  if(EDIT_MODE_DRAFT){
    const d = EDIT_THEME_DRAFT || draftFromTheme(student.missionTheme);
    student.missionTheme = (EDIT_MODE_DRAFT === 'vacation')
      ? { emoji: MISSION_THEME_DEFAULT.emoji, name: (d.name||'').trim() || 'Missão de Férias', message: (d.message||'').trim() }
      : null;
  }
  EDIT_THEME_DRAFT = null; EDIT_MODE_DRAFT = null;
  touch(student);
  await saveData();
  EDIT_STUDENT_MODE = false;
  showToast('Aluno atualizado! O material didático foi mantido.');
}
async function savePlannedMeta(){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  const errEl = document.getElementById('plan-meta-error');
  const startStage = document.getElementById('f-plan-start-stage').value;
  const startSheetRaw = document.getElementById('f-plan-start-sheet').value;
  const stage = document.getElementById('f-plan-stage').value;
  const sheetRaw = document.getElementById('f-plan-sheet').value;
  const startDate = document.getElementById('f-plan-start-date').value;
  const date = document.getElementById('f-plan-date').value;
  const fail = (t)=>{ if(errEl) errEl.textContent = t; };

  if(startSheetRaw==='' || !isValidSheet(startSheetRaw) || sheetRaw==='' || !isValidSheet(sheetRaw)){
    fail('Preencha as folhas de partida e da meta (entre 0 e 200).'); return;
  }
  if(!startDate || !date){ fail('Preencha a data inicial e a data final.'); return; }
  if(startDate >= date){ fail('A data final precisa ser depois da data inicial.'); return; }
  if(stagePoint(startStage, startSheetRaw) === stagePoint(stage, sheetRaw)){
    fail('O ponto de partida e a meta não podem ser iguais.'); return;
  }

  const d = PLAN_THEME_DRAFT || draftFromTheme(null);
  const planMode = PLAN_MODE_DRAFT === 'normal' ? 'normal' : 'vacation';
  if(!student.metaHistory) student.metaHistory = [];
  student.metaHistory = student.metaHistory.filter(e=>e.status!=='planned');
  student.metaHistory.push({
    id: uid(), status:'planned',
    startStage, startSheet: Number(startSheetRaw), startDate,
    targetStage: stage, targetSheet: Number(sheetRaw), targetEnd: date,
    mode: planMode,
    theme: planMode==='vacation' ? { emoji: MISSION_THEME_DEFAULT.emoji, name: (d.name||'').trim() || 'Missão de Férias', message: (d.message||'').trim() } : null,
    plannedAt: todayISO(),
    studentResponse: null,
    studentProposal: null,
    studentRespondedAt: null
  });
  touch(student);
  await saveData();
  PLAN_META_MODE = false; PLAN_THEME_DRAFT = null; PLAN_MODE_DRAFT = null; PLAN_EDIT_ID = null;
  showToast(planMode==='vacation' ? 'Próxima meta salva! O aluno já vê como "Próxima missão".' : 'Próxima meta salva! O aluno já vê como "Próxima meta".');
}
async function removePlannedMeta(id){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  student.metaHistory = (student.metaHistory||[]).filter(e=>e.id!==id);
  touch(student);
  await saveData();
  render();
}
async function endTrimester(){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  const archivedEntry = archiveCurrentMeta(student);
  TB_MODAL = {
    name: student.name, avatar: student.avatar,
    stage: `${student.startStage}${student.startSheet} → ${student.targetStage}${student.targetSheet}`,
    periodLabel: `${fmtDateFull(student.startDate)} a ${fmtDateFull(archivedEntry.archivedAt)}`,
    days: archivedEntry.balance.days, sheets: archivedEntry.balance.sheets,
    percent: archivedEntry.balance.percent, reached: archivedEntry.reached,
    allowUndo: true, studentId: student.id, entryId: archivedEntry.id
  };

  const planned = (student.metaHistory||[]).find(e=>e.status==='planned');
  const newStartStage = (planned && planned.startStage) || student.targetStage;
  const newStartSheet = (planned && planned.startStage) ? planned.startSheet : student.targetSheet;
  const newStartDate = (planned && planned.startDate) || todayISO();

  student.startStage = newStartStage;
  student.startSheet = newStartSheet;
  student.startDate = newStartDate;
  student.targetStart = newStartDate;
  // Reinicia as contagens do novo período: constância e prêmios (folhas e correções recomeçam com os novos blocos).
  student.constancyStart = newStartDate;
  student.rewards = {};

  if(planned){
    const { total, blocks } = buildBlocks(newStartStage, newStartSheet, planned.targetStage, planned.targetSheet);
    student.blocks = blocks;
    student.totalBlocks = total;
    student.targetStage = planned.targetStage;
    student.targetSheet = planned.targetSheet;
    student.targetEnd = planned.targetEnd;
    student.metaHistory = student.metaHistory.filter(e=>e.id!==planned.id);
    student.missionTheme = planned.theme || null;
    touch(student);
    await saveData();
    END_TRIMESTER_CONFIRM = null;
    showToast(planned.theme ? 'Nova meta ativada! O aluno já vê a missão de férias.' : 'Nova meta ativada!');
  } else {
    student.blocks = [];
    student.totalBlocks = 0;
    student.missionTheme = null;
    touch(student);
    await saveData();
    END_TRIMESTER_CONFIRM = null;
    EDIT_STUDENT_MODE = true;
    showToast('Trimestre encerrado! Defina a nova meta.');
  }
}
function shiftCalendarMonth(delta){
  const cur = CALENDAR_MONTH || { year:new Date().getFullYear(), month:new Date().getMonth() };
  let m = cur.month + delta, y = cur.year;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  CALENDAR_MONTH = { year:y, month:m };
}
async function toggleStudyDay(iso){
  const student = DATA.students.find(s=>s.id===SELECTED_STUDENT_ID);
  if(!student.attendance) student.attendance = {};
  const current = student.attendance[iso];
  if(!current) student.attendance[iso] = 'kumon';
  else if(current==='kumon') student.attendance[iso] = 'presencial';
  else if(current==='presencial') student.attendance[iso] = 'teste';
  else delete student.attendance[iso];
  touch(student);
  await saveData();
  render();
}
async function deleteStudent(){
  DATA.students = DATA.students.filter(s=>s.id!==SELECTED_STUDENT_ID);
  await saveData();
  DELETE_CONFIRM_ID = null;
  ADMIN_VIEW='students'; render();
}
async function applyBulkTargetEnd(date){
  if(!date) return;
  let changed = 0; const skipped = [];
  DATA.students.forEach(st=>{
    if(st.startDate && date < st.startDate){ skipped.push(st.name); return; }
    st.targetEnd = date; touch(st); changed++;
  });
  BULK_END_CONFIRM = null;
  await saveData();
  showToast(skipped.length
    ? `Fim da meta alterado para ${changed} alunos. Não alterado (data antes do início): ${skipped.join(', ')}.`
    : `Fim da meta alterado para ${changed} ${changed===1?'aluno':'alunos'}!`);
}
async function saveTrimesterDefaults(){
  const start = document.getElementById('f-trimester-start').value;
  const end = document.getElementById('f-trimester-end').value;
  if(!start || !end){ showToast('Preencha as duas datas do trimestre.'); return; }
  if(start > end){ showToast('A data de início deve ser antes da data de fim.'); return; }
  const previous=DATA.currentTrimester||{};
  if(previous.startDate && previous.endDate && (previous.startDate!==start || previous.endDate!==end)){
    if(!Array.isArray(DATA.trimesterHistory)) DATA.trimesterHistory=[];
    const exists=DATA.trimesterHistory.some(t=>t.startDate===previous.startDate && t.endDate===previous.endDate);
    if(!exists) DATA.trimesterHistory.push({id:uid(),startDate:previous.startDate,endDate:previous.endDate,savedAt:todayISO()});
  }
  DATA.currentTrimester = { startDate: start, endDate: end };
  HALL_TRIMESTER_INDEX=0;
  await saveData();
  showToast('Período atual salvo! O Hall já pode usar essas datas; elas também serão sugeridas para novos alunos.');
  render();
}
async function saveNewStudent(){
  const name = document.getElementById('f-name').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const avatar = document.querySelector('.avatar-opt.sel')?.getAttribute('data-avatar') || AVATARS[0];
  const startStage = document.getElementById('f-start-stage').value;
  const startSheet = Number(document.getElementById('f-start-sheet').value);
  const startDate = document.getElementById('f-start-date').value;
  const targetStage = document.getElementById('f-target-stage').value;
  const targetSheet = Number(document.getElementById('f-target-sheet').value);
  const targetDate = document.getElementById('f-target-date').value;
  const errEl = document.getElementById('add-error');

  if(!name || !/^\d+$/.test(code) || !startDate || !targetDate || !isValidSheet(startSheet) || !isValidSheet(targetSheet)){
    errEl.textContent = 'Preencha os campos corretamente. As folhas devem estar entre 0 e 200.'; return;
  }

  if(DATA.students.some(s=>s.code===code)){
    errEl.textContent = 'Este código já está em uso por outro aluno.'; return;
  }
  const { total, blocks } = buildBlocks(startStage, startSheet, targetStage, targetSheet);
  const nowIso = new Date().toISOString();
  const newStudent = {
    id: uid(), code, name, avatar,
    startStage, startSheet, startDate,
    targetStage, targetSheet, targetStart:startDate, targetEnd:targetDate,
    totalBlocks: total, blocks,
    weeklyHistory: [], attendance: {}, rewards: {}, metaHistory: [],
    createdAt: nowIso, updatedAt: nowIso
  };
  DATA.students.push(newStudent);
  await saveData();
  showToast('Aluno cadastrado!');
  SELECTED_STUDENT_ID = newStudent.id;
  CALENDAR_MONTH = null; EDIT_LABELS_MODE = false; EDIT_STUDENT_MODE = false; EDITING_FORGOT_INDEX = null; DELETE_CONFIRM_ID = null; PLAN_META_MODE = false; END_TRIMESTER_CONFIRM = null;
  ADMIN_VIEW = 'detail';
  render();
}

/* =========================================================
   BACKUP / RESTAURAÇÃO
   ========================================================= */
function downloadBackupNow(){
  try{
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `minha-meta-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup baixado!');
  }catch(e){
    console.error('Erro ao baixar backup', e);
    showToast('Não foi possível baixar o backup.');
  }
}
function triggerFileRestore(){
  const input = document.getElementById('input-restore-file');
  if(input) input.click();
}
function handleRestoreFileSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.students)) throw new Error('formato inválido');
      PENDING_RESTORE = { source:'file', label: `arquivo "${file.name}" (${parsed.students.length} aluno(s))`, data: parsed };
      render();
    }catch(err){
      showToast('Arquivo inválido. Verifique se é um backup do MINHA META.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
async function stageAutoRestore(id){
  showToast('Carregando backup…');
  const data = await getBackupById(id);
  if(!data || !Array.isArray(data.students)){
    showToast('Não foi possível carregar esse backup.');
    return;
  }
  PENDING_RESTORE = { source:'auto', label: fmtBackupId(id), data };
  render();
}
async function confirmPendingRestore(){
  if(!PENDING_RESTORE) return;
  await saveManualSnapshot(DATA, 'antes-de-restaurar');
  DATA = PENDING_RESTORE.data;
  migrateAttendance();
  migrateWeeklyHistory();
  await saveData();
  PENDING_RESTORE = null;
  showToast('Dados restaurados com sucesso!');
  render();
}
function cancelPendingRestore(){
  PENDING_RESTORE = null;
  render();
}
async function loadBackupsList(){
  BACKUPS_LOADING = true; render();
  AVAILABLE_BACKUPS = await listRecentBackups(30);
  BACKUPS_LOADING = false; render();
}

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  loadTheme();
  applyTheme();
  await loadData();
  render();
  if(auth){
    auth.onAuthStateChanged(user=>{
      if(user){
        SESSION={role:'admin',studentId:null};
        ADMIN_LOGIN_STAGE=false;
        LOGIN_ERROR='';
        render();
        syncPlanResponsesAdmin();
      }else if(SESSION.role==='admin'){
        SESSION={role:null,studentId:null};
        ADMIN_LOGIN_STAGE=false;
        ADMIN_VIEW='overview';
        LOGIN_ERROR='';
        render();
      }
    });
    setInterval(()=>{ if(SESSION && SESSION.role==='admin') syncPlanResponsesAdmin(); }, 60000);
  }
})();
